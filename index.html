<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Atlantida Market</title>

<script src="https://telegram.org/js/telegram-web-app.js?v=3"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b10;
  color:#fff;
  font-family:Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #202733;
  background:#0c1017;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.profileBtn{
  background:#151c26;
  border:1px solid #293342;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.hero{
  padding:25px 0;
}

.hero h1{
  margin:0 0 8px;
  font-size:32px;
}

.hero p{
  color:#9ba6b6;
}

.search{
  width:100%;
  background:#111720;
  color:#fff;
  border:1px solid #293342;
  padding:14px;
  border-radius:13px;
  outline:none;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:15px 0;
}

.categories button{
  white-space:nowrap;
  background:#111720;
  color:#cbd3df;
  border:1px solid #293342;
  border-radius:12px;
  padding:10px 14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:15px;
}

.card{
  background:#10151d;
  border:1px solid #252e3b;
  border-radius:18px;
  padding:17px;
}

.card h3{
  margin:0 0 8px;
}

.muted{
  color:#8f9aaa;
  font-size:13px;
}

.price{
  font-size:20px;
  font-weight:900;
  margin:15px 0;
}

.buy,.submit{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  background:#fff;
  color:#080b10;
  font-weight:900;
}

.empty{
  text-align:center;
  padding:50px 15px;
  color:#8f9aaa;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(600px,100%);
  background:#0e131b;
  border:1px solid #293342;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modalHead h2{
  margin:0;
}

.close{
  background:#171e28;
  border:1px solid #293342;
  color:#fff;
  width:38px;
  height:38px;
  border-radius:10px;
  font-size:22px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.form input{
  width:100%;
  background:#080c12;
  color:#fff;
  border:1px solid #293342;
  border-radius:12px;
  padding:14px;
  outline:none;
}

.walletInfo{
  background:#121923;
  border:1px solid #293342;
  padding:14px;
  border-radius:14px;
  word-break:break-all;
}

.danger{
  width:100%;
  border:1px solid #493038;
  background:#171015;
  color:#ff8585;
  border-radius:13px;
  padding:13px;
  font-weight:800;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#171e28;
  border:1px solid #344052;
  padding:13px 18px;
  border-radius:13px;
  display:none;
  z-index:200;
  max-width:90%;
  text-align:center;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">⚡ Atlantida Market</div>
  <button class="profileBtn" onclick="showProfile()">👤 Профиль</button>
</header>

<main class="container">

  <section class="hero">
    <h1>Atlantida Market</h1>
    <p>Маркет цифровых товаров и услуг</p>
  </section>

  <input
    id="search"
    class="search"
    placeholder="🔎 Поиск товаров..."
    oninput="render()"
  >

  <div class="categories">
    <button onclick="setCategory('')">Все</button>
    <button onclick="setCategory('stars')">⭐ Stars</button>
    <button onclick="setCategory('gifts')">🎁 Gifts</button>
    <button onclick="setCategory('nft')">💎 NFT</button>
    <button onclick="setCategory('crypto')">💰 Crypto</button>
  </div>

  <div id="list" class="grid"></div>

</main>

<!-- PROFILE / PAYMENT -->
<div class="modal" id="paymentModal">
  <div class="modalBox">

    <div class="modalHead">
      <h2>💰 Способы оплаты</h2>
      <button class="close" onclick="closePayment()">×</button>
    </div>

    <div class="muted" style="margin-bottom:15px">
      Укажи публичные адреса кошельков.
      Seed-фраза и приватный ключ здесь не нужны.
    </div>

    <div class="form">

      <label>💎 TON</label>

      <input
        id="tonWallet"
        placeholder="EQ... / UQ..."
        autocomplete="off"
        spellcheck="false"
      >

      <label>💵 USDT ERC-20</label>

      <input
        id="usdtWallet"
        placeholder="0x..."
        autocomplete="off"
        spellcheck="false"
      >

      <button class="submit" onclick="saveCryptoSend()">
        💾 Сохранить кошельки
      </button>

      <button class="danger" onclick="deleteCryptoSend()">
        🗑️ Отвязать кошельки
      </button>

    </div>

  </div>
</div>

<!-- BUY -->
<div class="modal" id="buyModal">
  <div class="modalBox">

    <div class="modalHead">
      <h2>💳 Оплата</h2>
      <button class="close" onclick="closeBuy()">×</button>
    </div>

    <div id="buyContent"></div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram?.WebApp || null;

if(tg){
  tg.ready();
  tg.expand();
}

const API = "https://atlantidamarket.onrender.com";

let allListings = [];
let currentCategory = "";

function user(){
  return tg?.initDataUnsafe?.user || {
    id:0,
    first_name:"Игрок",
    username:"demo"
  };
}

function toast(message){
  const el = document.getElementById("toast");

  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    el.style.display = "none";
  },3000);
}

function setCategory(category){
  currentCategory = category;
  render();
}

async function loadListings(){

  const list = document.getElementById("list");

  try{

    const response = await fetch(
      API + "/api/listings"
    );

    if(!response.ok)
      throw new Error("API");

    allListings = await response.json();

    render();

  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        ⚠️<br><br>
        Не удалось загрузить товары.
      </div>
    `;
  }
}

function render(){

  const list = document.getElementById("list");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const items = allListings.filter(item=>{

    const matchesSearch =
      !search ||
      String(item.name || "")
        .toLowerCase()
        .includes(search);

    const matchesCategory =
      !currentCategory ||
      String(item.category || "")
        .toLowerCase()
        .includes(currentCategory);

    return matchesSearch && matchesCategory;
  });

  if(!items.length){

    list.innerHTML = `
      <div class="empty">
        Пока товаров нет.
      </div>
    `;

    return;
  }

  list.innerHTML = items.map(item=>`

    <div class="card">

      <div class="muted">
        ${escapeHtml(item.category || "Товар")}
      </div>

      <h3>
        ${escapeHtml(item.name || "Без названия")}
      </h3>

      <div class="muted">
        ${escapeHtml(item.description || "")}
      </div>

      <div class="price">
        ${escapeHtml(item.price || "0")}
      </div>

      <button
        class="buy"
        onclick="buy(${Number(item.id)})"
      >
        Купить
      </button>

    </div>

  `).join("");
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================
   PROFILE
========================= */

async function showProfile(){

  const u = user();

  if(!u.id){

    toast("⚠️ Открой маркет через Telegram");

    return;
  }

  const connected = await getCryptoSend();

  document.getElementById("tonWallet").value =
    connected?.ton_wallet || "";

  document.getElementById("usdtWallet").value =
    connected?.usdt_wallet || "";

  document
    .getElementById("paymentModal")
    .classList
    .add("show");
}

function closePayment(){

  document
    .getElementById("paymentModal")
    .classList
    .remove("show");
}

async function getCryptoSend(){

  try{

    const sellerId = Number(user()?.id || 0);

    if(!sellerId)
      throw new Error("Telegram ID отсутствует");

    const response = await fetch(
      API +
      "/api/payment-methods/" +
      encodeURIComponent(sellerId)
    );

    const text = await response.text();

    let result;

    try{
      result = JSON.parse(text);
    }catch{
      result = {
        ok:false,
        error:text
      };
    }

    if(!response.ok || !result.ok){

      console.error(
        "GET payment error:",
        response.status,
        result
      );

      toast(
        "❌ " +
        (
          result.message ||
          result.error ||
          "Ошибка загрузки"
        )
      );

      return null;
    }

    return result;

  }catch(error){

    console.error(error);

    toast("❌ Не удалось загрузить кошельки");

    return null;
  }
}

/* =========================
   SAVE WALLETS
========================= */

async function saveCryptoSend(){

  const currentUser = user();

  const sellerId =
    Number(currentUser?.id || 0);

  alert("Telegram ID: " + sellerId);

  const ton =
    document
      .getElementById("tonWallet")
      .value
      .trim();

  const usdt =
    document
      .getElementById("usdtWallet")
      .value
      .trim();

  if(!sellerId){

    toast(
      "⚠️ Открой маркет через Telegram"
    );

    return;
  }

  if(!ton && !usdt){

    toast(
      "⚠️ Укажи хотя бы один кошелёк"
    );

    return;
  }

  /*
    TON.
    Проверяем формат адреса.
  */

  if(
    ton &&
    !(
      /^(EQ|UQ|kQ)[A-Za-z0-9_-]+$/.test(ton)
    )
  ){

    toast(
      "⚠️ Неверный TON-адрес"
    );

    return;
  }

  /*
    USDT ERC-20.
    0x + 40 hex символов.
  */

  if(
    usdt &&
    !/^0x[a-fA-F0-9]{40}$/.test(usdt)
  ){

    toast(
      "⚠️ Неверный USDT ERC-20 адрес"
    );

    return;
  }

  try{

    const response = await fetch(
      API + "/api/payment-methods",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          seller_id:sellerId,
          ton_wallet:ton,
          usdt_wallet:usdt
        })
      }
    );

    const text =
      await response.text();

    let result;

    try{

      result = JSON.parse(text);

    }catch{

      result = {
        ok:false,
        error:text
      };
    }

    console.log(
      "Payment API:",
      response.status,
      result
    );

    if(
      !response.ok ||
      !result.ok
    ){

      toast(
        "❌ " +
        (
          result.message ||
          result.error ||
          "Ошибка сервера"
        )
      );

      return;
    }

    toast(
      "✅ Кошельки сохранены"
    );

  }catch(error){

    console.error(
      "Payment error:",
      error
    );

    toast(
      "❌ Ошибка соединения с сервером"
    );
  }
}

/* =========================
   DELETE WALLETS
========================= */

async function deleteCryptoSend(){

  const sellerId =
    Number(user()?.id || 0);

  if(!sellerId){

    toast(
      "⚠️ Открой маркет через Telegram"
    );

    return;
  }

  try{

    const response = await fetch(
      API + "/api/payment-methods",
      {
        method:"DELETE",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          seller_id:sellerId
        })
      }
    );

    const text =
      await response.text();

    let result;

    try{
      result = JSON.parse(text);
    }catch{
      result = {};
    }

    if(
      !response.ok ||
      result.ok === false
    ){

      throw new Error(
        result.error || "Ошибка"
      );
    }

    document
      .getElementById("tonWallet")
      .value = "";

    document
      .getElementById("usdtWallet")
      .value = "";

    toast(
      "✅ Кошельки отвязаны"
    );

  }catch(error){

    console.error(error);

    toast(
      "❌ Не удалось отвязать кошельки"
    );
  }
}

/* =========================
   BUY
========================= */

async function buy(listingId){

  const item =
    allListings.find(
      x => Number(x.id) === Number(listingId)
    );

  if(!item){

    toast("❌ Товар не найден");

    return;
  }

  const sellerId =
    Number(item.seller_id || 0);

  if(!sellerId){

    toast(
      "❌ У товара не указан продавец"
    );

    return;
  }

  const content =
    document.getElementById("buyContent");

  content.innerHTML =
    `<div class="empty">Загрузка способов оплаты...</div>`;

  document
    .getElementById("buyModal")
    .classList
    .add("show");

  try{

    const response = await fetch(
      API +
      "/api/payment-methods/" +
      encodeURIComponent(sellerId)
    );

    const result =
      await response.json();

    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error || "Ошибка"
      );
    }

    let html = `
      <h3>
        ${escapeHtml(item.name || "Товар")}
      </h3>

      <p class="muted">
        Цена: ${escapeHtml(item.price || "0")}
      </p>
    `;

    if(result.ton_wallet){

      html += `
        <div class="walletInfo">
          <b>💎 TON</b><br><br>
          ${escapeHtml(result.ton_wallet)}
        </div>
      `;
    }

    if(result.usdt_wallet){

      html += `
        <div class="walletInfo">
          <b>💵 USDT ERC-20</b><br><br>
          ${escapeHtml(result.usdt_wallet)}
        </div>
      `;
    }

    if(
      !result.ton_wallet &&
      !result.usdt_wallet
    ){

      html += `
        <div class="empty">
          Продавец пока не подключил
          способы оплаты.
        </div>
      `;
    }

    content.innerHTML = html;

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="empty">
        ❌ Не удалось загрузить
        способы оплаты.
      </div>
    `;
  }
}

function closeBuy(){

  document
    .getElementById("buyModal")
    .classList
    .remove("show");
}

/* ========================= */

loadListings();
</script>

</body>
</html>
