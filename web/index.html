<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070812">
<title>Atlantida Market</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#060711;color:#f7f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}

body:before{
 content:"";position:fixed;inset:-30%;z-index:-2;
 background:
 radial-gradient(circle at 15% 10%,rgba(0,190,255,.20),transparent 25%),
 radial-gradient(circle at 85% 15%,rgba(128,55,255,.20),transparent 27%),
 radial-gradient(circle at 50% 90%,rgba(0,115,255,.12),transparent 30%);
 animation:ambient 10s ease-in-out infinite alternate
}
body:after{
 content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(120deg,transparent,rgba(255,255,255,.025),transparent)
}
@keyframes ambient{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.06)}}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;color:inherit}
a{color:inherit;text-decoration:none}

#app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:92px}

.topbar{
 position:sticky;top:0;z-index:20;
 padding:14px 15px 12px;
 backdrop-filter:blur(22px);
 background:rgba(6,7,17,.72);
 border-bottom:1px solid rgba(255,255,255,.07)
}
.brand{
 display:flex;align-items:center;justify-content:space-between;gap:12px
}
.logo{
 font-size:22px;font-weight:900;letter-spacing:-.7px;
 background:linear-gradient(90deg,#fff,#58dcff,#9d6cff);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.badge{
 padding:7px 11px;border-radius:999px;
 background:linear-gradient(135deg,rgba(0,212,255,.16),rgba(132,75,255,.18));
 border:1px solid rgba(105,205,255,.18);
 color:#a9eaff;font-size:11px;font-weight:800
}

.hero{
 margin:16px 15px;
 padding:23px 20px;
 border-radius:27px;
 position:relative;overflow:hidden;
 background:
 linear-gradient(135deg,rgba(16,20,43,.94),rgba(18,11,40,.90));
 border:1px solid rgba(140,150,255,.16);
 box-shadow:0 18px 55px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.07)
}
.hero:before{
 content:"";position:absolute;width:210px;height:210px;border-radius:50%;
 right:-80px;top:-100px;
 background:radial-gradient(circle,rgba(72,210,255,.35),transparent 68%);
 filter:blur(5px)
}
.hero:after{
 content:"";position:absolute;width:170px;height:170px;border-radius:50%;
 left:-90px;bottom:-120px;
 background:radial-gradient(circle,rgba(135,63,255,.3),transparent 68%)
}
.hero h1{position:relative;margin:0 0 8px;font-size:30px;line-height:1.05;letter-spacing:-1.2px}
.hero p{position:relative;margin:0;color:#aeb3c8;font-size:14px;line-height:1.5}
.hero-glow{
 position:absolute;right:20px;bottom:18px;width:9px;height:9px;border-radius:50%;
 background:#52e5ff;box-shadow:0 0 22px 8px rgba(0,210,255,.4)
}

.searchbox{
 margin:0 15px 14px;position:relative
}
.searchbox input{
 width:100%;height:49px;border-radius:17px;padding:0 17px 0 45px;
 color:#fff;outline:0;
 background:rgba(19,21,35,.78);
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 30px rgba(0,0,0,.18);
 backdrop-filter:blur(15px)
}
.searchbox input:focus{border-color:rgba(65,210,255,.42);box-shadow:0 0 0 3px rgba(65,210,255,.07)}
.searchbox:before{content:"⌕";position:absolute;left:17px;top:9px;font-size:24px;color:#77819b;z-index:2}

.section{
 padding:0 15px;margin:20px 0
}
.section-title{
 display:flex;align-items:center;justify-content:space-between;margin-bottom:11px
}
.section-title h2{font-size:17px;margin:0;letter-spacing:-.3px}
.section-title span{font-size:12px;color:#777f99}

#homeCats,#catalogCats{
 display:flex;gap:9px;overflow-x:auto;padding:2px 1px 7px;
 scrollbar-width:none
}
#homeCats::-webkit-scrollbar,#catalogCats::-webkit-scrollbar{display:none}

.cat{
 flex:0 0 auto;padding:10px 14px;border-radius:14px;
 color:#aab1c8;font-size:12px;font-weight:800;
 background:rgba(19,22,37,.72);
 border:1px solid rgba(255,255,255,.07);
 transition:.2s
}
.cat:hover,.cat.active{
 color:#fff;border-color:rgba(68,214,255,.35);
 background:linear-gradient(135deg,rgba(0,190,255,.16),rgba(125,66,255,.16));
 box-shadow:0 7px 24px rgba(0,174,255,.08)
}

.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px
}
.card{
 min-width:0;padding:15px;border-radius:21px;
 background:linear-gradient(145deg,rgba(20,23,39,.92),rgba(12,14,27,.88));
 border:1px solid rgba(255,255,255,.075);
 box-shadow:0 14px 35px rgba(0,0,0,.23);
 transition:transform .18s,border-color .18s,box-shadow .18s;
 position:relative;overflow:hidden
}
.card:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.055),transparent 30%)
}
.card:hover{
 transform:translateY(-2px);
 border-color:rgba(80,210,255,.25);
 box-shadow:0 18px 42px rgba(0,0,0,.34),0 0 25px rgba(70,170,255,.06)
}
.card>*{position:relative}
.card-title{font-size:14px;font-weight:850;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:11px;color:#8189a0;min-height:31px;line-height:1.4}
.card-price{
 margin-top:12px;font-size:18px;font-weight:900;
 background:linear-gradient(90deg,#55e5ff,#a276ff);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.card-meta{font-size:10px;color:#68718a;margin-top:5px}

.empty{
 padding:28px 15px;text-align:center;color:#6f7892;
 border:1px dashed rgba(255,255,255,.08);border-radius:19px
}

input,textarea,select{
 background:#111425;color:#fff;border:1px solid rgba(255,255,255,.09);
 border-radius:14px;padding:12px;outline:0
}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(71,211,255,.4)}

.btn{
 min-height:44px;padding:0 16px;border-radius:14px;font-weight:850;
 background:linear-gradient(135deg,#13c8f5,#6758ff);
 box-shadow:0 10px 28px rgba(45,146,255,.18);
 transition:.18s
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.secondary{
 background:rgba(255,255,255,.055);box-shadow:none;
 border:1px solid rgba(255,255,255,.08)
}

#modal,#publicChatOverlay{
 background:rgba(2,3,9,.78)!important;
 backdrop-filter:blur(18px)!important
}
#modalContent{
 background:linear-gradient(145deg,#15192b,#0c0e1b)!important;
 border:1px solid rgba(132,150,255,.18)!important;
 box-shadow:0 25px 90px rgba(0,0,0,.65)!important;
 border-radius:27px!important
}

.bottom-nav{
 position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
 width:min(690px,calc(100% - 24px));z-index:30;
 display:flex;justify-content:space-around;align-items:center;
 padding:8px;
 border-radius:22px;
 background:rgba(13,15,28,.84);
 border:1px solid rgba(255,255,255,.08);
 backdrop-filter:blur(24px);
 box-shadow:0 18px 55px rgba(0,0,0,.45)
}
.bottom-nav button{
 flex:1;background:transparent;color:#747d97;padding:8px 3px;
 border-radius:16px;font-size:10px;font-weight:800
}
.bottom-nav button:hover{
 color:#fff;background:rgba(255,255,255,.05)
}
.bottom-nav .main{
 color:#61ddff;
 background:linear-gradient(135deg,rgba(0,195,255,.12),rgba(128,67,255,.12))
}

.toast{
 border:1px solid rgba(100,220,255,.18)!important;
 background:rgba(13,17,31,.94)!important;
 box-shadow:0 12px 40px rgba(0,0,0,.45)!important;
 backdrop-filter:blur(20px)
}

@media(max-width:430px){
 #app{padding-bottom:88px}
 .hero{padding:20px 17px;border-radius:23px}
 .hero h1{font-size:27px}
 .grid{gap:9px}
 .card{padding:13px;border-radius:18px}
}

/* PREMIUM TRADE UI */

#modalContent h2{
  margin:0 0 18px;
  font-size:24px;
  font-weight:900;
  letter-spacing:-.4px;
}

#modalContent .info{
  margin:10px 0;
  padding:14px 15px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.075);
  color:#aeb7ce;
  line-height:1.5;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

#modalContent .info b{
  color:#fff;
  font-weight:850;
}

#modalContent #txHash{
  width:100%!important;
  margin-top:12px!important;
  min-height:50px;
  padding:14px 15px!important;
  border:1px solid rgba(100,180,255,.16)!important;
  border-radius:16px!important;
  outline:none;
  background:rgba(5,8,18,.72)!important;
  color:#fff!important;
  font-size:14px;
  transition:.2s;
  box-shadow:inset 0 1px 8px rgba(0,0,0,.18);
}

#modalContent #txHash::placeholder{
  color:#68738d;
}

#modalContent #txHash:focus{
  border-color:rgba(64,205,255,.55)!important;
  box-shadow:
    0 0 0 3px rgba(39,196,255,.08),
    0 8px 30px rgba(0,0,0,.2);
}

#modalContent .primary{
  width:100%;
  min-height:50px;
  margin-top:12px!important;
  border-radius:16px;
  font-weight:850;
  background:linear-gradient(135deg,#13c8f5,#6758ff);
  box-shadow:
    0 10px 30px rgba(54,125,255,.22),
    inset 0 1px 0 rgba(255,255,255,.18);
  transition:.2s;
}

#modalContent .primary:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

#modalContent .primary:active{
  transform:translateY(1px) scale(.99);
}

#modalContent .info:first-of-type{
  border-color:rgba(40,205,255,.12);
}

@media(max-width:430px){
  #modalContent{
    border-radius:23px!important;
    padding:20px!important;
  }

  #modalContent h2{
    font-size:21px;
  }
}




/* PREMIUM REVIEWS UI */

.reviews-summary{
  margin:14px 0;
  padding:18px;
  border-radius:20px;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,194,70,.14),transparent 45%),
    linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
}

.reviews-score{
  display:flex;
  align-items:center;
  gap:12px;
}

.reviews-score-number{
  font-size:32px;
  font-weight:950;
  letter-spacing:-1px;
  color:#fff;
}

.reviews-stars{
  color:#ffd45c;
  font-size:18px;
  letter-spacing:1px;
}

.reviews-count{
  margin-top:5px;
  color:#7e8aa5;
  font-size:12px;
}

.review-card{
  margin:10px 0;
  padding:15px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.065);
}

.review-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.review-author{
  color:#fff;
  font-size:13px;
  font-weight:850;
}

.review-date{
  color:#66728d;
  font-size:10px;
}

.review-rating{
  margin-top:7px;
  color:#ffd45c;
  font-size:14px;
}

.review-text{
  margin-top:9px;
  color:#aeb7ce;
  font-size:13px;
  line-height:1.5;
}

.review-form{
  margin-top:14px;
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.065);
}

.review-form textarea{
  width:100%;
  min-height:90px;
  margin-top:10px;
  padding:13px;
  resize:vertical;
  border-radius:15px;
  border:1px solid rgba(100,180,255,.14);
  background:rgba(5,8,18,.7);
  color:#fff;
  outline:none;
  box-sizing:border-box;
}

.review-form textarea:focus{
  border-color:rgba(64,205,255,.5);
}

.review-stars-select{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.review-star{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#68738d;
  border-radius:12px;
  width:42px;
  height:40px;
  font-size:18px;
  cursor:pointer;
}

.review-star.active{
  color:#ffd45c;
  border-color:rgba(255,212,92,.35);
  background:rgba(255,212,92,.08);
}

@media(max-width:430px){
  .reviews-score-number{
    font-size:28px;
  }
}

/* PREMIUM TRADE DETAILS */

.trade-detail-hero{
  margin:4px 0 16px;
  padding:20px;
  border-radius:22px;
  background:
    radial-gradient(circle at 100% 0%,rgba(35,190,255,.16),transparent 42%),
    linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));

    0 15px 45px rgba(0,0,0,.25),

}

.trade-detail-label{

  font-weight:800;
  text-transform:uppercase;

}

.trade-detail-amount{
  margin-top:7px;
  font-size:30px;
  font-weight:950;
  letter-spacing:-.8px;
  background:linear-gradient(90deg,#fff,#75e5ff);
  -webkit-background-clip:text;

}

.trade-detail-grid{

.trade-detail-item{

.trade-detail-item span{
  display:block;

}

.trade-detail-actions{

}

  .trade-detail-grid{
    grid-template-columns:1fr;
  }

  .trade-detail-amount{

  }

/* PREMIUM TRADE CARDS */

.trade-card{
  position:relative;
  margin:10px 0;
  padding:16px;
  border-radius:20px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 12px 35px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.035);
  cursor:pointer;
  transition:.2s ease;
  overflow:hidden;
}

.trade-card:before{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  right:-55px;
  top:-55px;
  border-radius:50%;
  background:rgba(35,190,255,.12);
  filter:blur(20px);
  pointer-events:none;
}

.trade-card:hover{
  transform:translateY(-2px);
  border-color:rgba(75,205,255,.2);
  box-shadow:0 16px 42px rgba(0,0,0,.3);
}

.trade-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.trade-card-title{
  font-size:15px;
  font-weight:900;
}

.trade-card-id{
  color:#71809c;
  font-size:11px;
  font-weight:700;
}

.trade-card-price{
  margin-top:13px;
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
  background:linear-gradient(90deg,#fff,#7ce6ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.trade-card-meta{
  margin-top:5px;
  color:#7e8aa5;
  font-size:12px;
}

.trade-card-status{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid rgba(255,255,255,.055);

  font-weight:800;

</style>
</head>
<body>

<div id="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">✦ ATLANTIDA MARKET</div>
    <div class="badge">PREMIUM</div>
  </div>
</header>

<section class="hero">
  <h1>Маркет, де все<br>під рукою.</h1>
  <p>Подарунки • Stars • NFT • TON<br>Швидкий пошук потрібних пропозицій.</p>
  <div class="hero-glow"></div>
</section>

<div class="searchbox">
  <input id="search" placeholder="Поиск товарів..." autocomplete="off">
</div>

<section class="section">
  <div class="section-title">
    <h2>Категории</h2>
    <span id="count"></span>
  </div>
  <div id="homeCats"></div>
  <div id="catalogCats"></div>
</section>

<section class="section">
  <div id="homeGrid" class="grid"></div>
  <div id="catalogGrid" class="grid"></div>
  <div id="favGrid" class="grid"></div>
</section>

<section class="section" id="sellSection">
  <div class="section-title"><h2>Продать</h2></div>
  <input id="sellTitle" placeholder="Название">
  <select id="sellCategory"></select>
  <input id="sellAmount" placeholder="Количество">
  <input id="sellPrice" placeholder="Цена">
  <select id="sellCurrency"></select>
  <textarea id="sellDesc" placeholder="Описание"></textarea>
</section>

<section class="section" id="profileSection">
  <div class="section-title"><h2>Профиль</h2></div>
  <div id="avatar"></div>
  <div id="profileName"></div>
  <div id="profileUsername"></div>
  <div id="myListings"></div>
  <div id="favCount"></div>
  <div id="tradeCount"></div>
  <input id="tonWallet" placeholder="TON wallet">
  <input id="usdtWallet" placeholder="USDT wallet">
  <div id="tonStatus"></div>
  <div id="usdtStatus"></div>
</section>

<div id="modal"><div id="modalContent"></div></div>
<div id="toast"></div>

<div id="publicChatOverlay">
  <div id="publicChatMessages"></div>
  <input id="publicChatInput" placeholder="Повідомлення...">
</div>

</div>

<nav class="bottom-nav">
  <button class="main" onclick="showPage('home')">⌂<br>Главная</button>
  <button onclick="showPage('catalog')">◈<br>Каталог</button>
  <button onclick="showPage('favorites')">♡<br>Избранное</button>
  <button onclick="showPage('profile')">♙<br>Профиль</button>
</nav>

<script>

const API = "https://atlantidamarket.onrender.com";

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


let listings = [];
let category = "Все";

let favorites = JSON.parse(
  localStorage.getItem("atlantida_favorites") || "[]"
);


const CATEGORIES = [
  ["Все","🌐"],
  ["gifts","🎁"],
  ["stars","⭐"],
  ["nft","💎"],
  ["ton","💠"],
  ["crypto","🪙"],
  ["other","📦"]
];


function user(){
  return tg?.initDataUnsafe?.user || {
    id: 0,
    first_name: "Игрок",
    username: "demo"
  };
}


function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function toast(text){
  const x=document.getElementById("toast");

  x.textContent=text;
  x.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    x.style.display="none";
  },2200);
}


function showPage(page){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  const el=document.getElementById(page);

  if(el) el.classList.add("active");

  document.querySelectorAll(".nav")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.dataset.page===page
      );
    });

  window.scrollTo(0,0);

  if(page==="profile") loadProfile();
  if(page==="favorites") renderFavorites();
  if(page==="catalog") loadListings();
}


function categoryIcon(c){
  const x=CATEGORIES.find(v=>v[0]===c);
  return x ? x[1] : "📦";
}


function renderCategories(){

  const make = id => {

    const box=document.getElementById(id);

    if(!box) return;

    box.innerHTML=CATEGORIES.map(c=>`
      <button
        class="cat ${category===c[0]?"active":""}"
        onclick="setCategory('${c[0]}')"
      >
        ${c[1]} ${c[0]==="Все"?"Все":c[0].toUpperCase()}
      </button>
    `).join("");
  };

  make("homeCats");
  make("catalogCats");
}


function setCategory(c){
  category=c;
  showPage("catalog");
  renderCategories();
  loadListings();
}


async function loadListings(){

  renderCategories();

  const search=document.getElementById("search")?.value.trim() || "";

  try{

    const url =
      API +
      "/api/listings?category=" +
      encodeURIComponent(category) +
      "&search=" +
      encodeURIComponent(search);

    const res=await fetch(url,{cache:"no-store"});
    const data=await res.json();

    listings=Array.isArray(data.listings)
      ? data.listings
      : [];

    render();

  }catch(e){

    console.error(e);

    listings=[];

    render();

  }
}


function render(){

  const catalog=document.getElementById("catalogGrid");
  const home=document.getElementById("homeGrid");

  document.getElementById("count").textContent =
    listings.length + " товаров";

  if(!listings.length){

    catalog.innerHTML=
      '<div class="empty">📦<br><br>Товаров пока нет</div>';

    home.innerHTML=
      '<div class="empty">Пока нет объявлений</div>';

    return;
  }


  const html=listings.map(card).join("");

  catalog.innerHTML=html;
  home.innerHTML=listings.slice(0,6).map(card).join("");

  updateProfileStats();
}


function card(x){

  const fav=favorites.includes(Number(x.id));

  return `
    <div class="card" onclick="openProduct(${Number(x.id)})">

      <button
        class="fav"
        onclick="event.stopPropagation();toggleFavorite(${Number(x.id)})"
      >
        ${fav?"❤️":"🤍"}
      </button>

      <div class="card-icon">
        ${categoryIcon(x.category)}
      </div>

      <h3>${esc(x.title || x.name)}</h3>

      <div class="meta">
        ${esc(x.amount || "1")} • ${esc(x.category)}
      </div>

      <div class="price">
        ${esc(x.price)} ${esc(x.currency || "TON")}
      </div>

    </div>
  `;
}


function toggleFavorite(id){

  id=Number(id);

  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
    toast("Удалено из избранного");
  }else{
    favorites.push(id);
    toast("Добавлено в избранное");
  }

  localStorage.setItem(
    "atlantida_favorites",
    JSON.stringify(favorites)
  );

  render();
  renderFavorites();
  updateProfileStats();
}


function renderFavorites(){

  const box=document.getElementById("favGrid");

  const items=listings.filter(
    x=>favorites.includes(Number(x.id))
  );

  if(!items.length){

    box.innerHTML=
      '<div class="empty">❤️<br><br>Избранное пусто</div>';

    return;
  }

  box.innerHTML=items.map(card).join("");
}

  );

  if(!x) return;

  const modal=document.getElementById("modal");
  const content=document.getElementById("modalContent");

    <div class="detail-icon">
      ${categoryIcon(x.category)}
    </div>

    <h2>${esc(x.title || x.name)}</h2>

    <div class="price">
      ${esc(x.price)} ${esc(x.currency || "TON")}
    </div>

    <div class="info">
      <b>Количество</b><br>
      ${esc(x.amount || "1")}
    </div>

    <div class="info">
      <b>Категория</b><br>
      ${esc(x.category)}
    </div>

    <div class="info">
      <b>Описание</b><br>
      ${esc(x.description || "Без описания")}
    </div>

    <div class="info">
      <b>Продавец</b><br>
      ${esc(x.seller_name || "Пользователь")}
      ${x.seller_username

        : ""}
    </div>

function closeModal(){
  document.getElementById("modal")
    .classList.remove("show");
}


async function createTrade(listingId){

  const u=user();

  try{

    const res=await fetch(API+"/api/trades",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        listing_id:Number(listingId),
        buyer_id:Number(u.id)
      })
    });

    const data=await res.json();

    if(!res.ok || !data.ok){
      toast(data.error || "Не удалось создать сделку");
      return;
    }

    closeModal();

    toast("Сделка создана");

    showTradeInfo(data.trade_id);

  }catch(e){

    toast("Ошибка соединения");

  }
}


async function showTradeInfo(tradeId){

  const u=user();

  const modal=document.getElementById("modal");
  const content=document.getElementById("modalContent");

  content.innerHTML=`
    <h2>🤝 Сделка #${tradeId}</h2>
    <div class="info">
      ⏳ Сделка создана.<br><br>
      Ожидается оплата.
    </div>

    <div class="info">
      После оплаты укажи хэш транзакции,
      чтобы его можно было проверить.
    </div>

    <input
      id="txHash"
      placeholder="Хэш транзакции"
      style="width:100%;margin-top:10px;border:1px solid #26394f;background:#101d2d;color:#fff;border-radius:12px;padding:12px"
    >

    <button
      class="primary"
      style="margin-top:10px"
      onclick="submitTx(${tradeId})"
    >
      Отправить транзакцию на проверку
    </button>
  `;

  modal.classList.add("show");
}


async function submitTx(tradeId){

  const hash=document.getElementById("txHash")
    ?.value.trim();

  if(!hash){
    toast("Укажи хэш транзакции");
    return;
  }

  try{

    const res=await fetch(API+"/api/trades/tx",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        trade_id:Number(tradeId),
        user_id:Number(user().id),
        tx_hash:hash
      })
    });

    const data=await res.json();

    if(!res.ok || !data.ok){
      toast(data.error || "Ошибка");
      return;
    }

    toast("Транзакция отправлена на проверку");
    closeModal();

  }catch(e){

    toast("Ошибка соединения");

  }
}


async function showTrades(type){

  const u=user();

  const content=document.getElementById("modalContent");

  content.innerHTML=`
    <h2>
      ${type==="buy"?"🛍️ Мои покупки":"💰 Мои продажи"}
    </h2>
    <div id="tradesBox" class="empty">
      Загрузка...
    </div>
  `;

  document.getElementById("modal")
    .classList.add("show");

  try{

    const res=await fetch(
      API+"/api/trades?user_id="+
      encodeURIComponent(u.id)
    );

    const data=await res.json();

    const trades=Array.isArray(data)
      ? data
      : (Array.isArray(data.trades)
        ? data.trades
        : []);

    const filtered=trades.filter(x=>
      type==="buy"
        ? Number(x.buyer_id)===Number(u.id)
        : Number(x.seller_id)===Number(u.id)
    );

    const box=document.getElementById("tradesBox");

    if(!filtered.length){
      box.innerHTML=
        "📦<br><br>Пока нет сделок";
      return;
    }

    box.className="";

    box.innerHTML=filtered.map(x=>`

      <div
        class="trade-card"
        onclick="openTrade(${Number(x.id)},'${type}')"
      >

        <div class="trade-card-head">
          <div class="trade-card-title">
            🤝 Сделка #${Number(x.id)}
          </div>

          <div class="trade-card-id">
            #${Number(x.listing_id)}
          </div>
        </div>

        <div class="trade-card-price">
          ${esc(x.amount || "—")}
          ${esc(x.currency || "")}
        </div>

        <div class="trade-card-meta">
          Объявление #${Number(x.listing_id)}
        </div>

        <div class="trade-card-status">
          ${tradeStatus(x.status)}
        </div>

      </div>

    `).join("");

  }catch(e){

    document.getElementById("tradesBox").innerHTML=
      "Ошибка соединения";

  }
}


async function loadSellerReviews(sellerId){

  try{

    const res=await fetch(
      API+"/api/reviews?seller_id="+
      encodeURIComponent(sellerId)
    );

    const data=await res.json();

    if(!data.ok){
      return {
        average:0,
        count:0,
        reviews:[]
      };
    }

    return {
      average:Number(data.average || 0),
      count:Number(data.count || 0),
      reviews:Array.isArray(data.reviews)
        ? data.reviews
        : []
    };

  }catch(e){

    return {
      average:0,
      count:0,
      reviews:[]
    };

  }
}

function reviewStars(rating){

  const n=Math.max(
    0,
    Math.min(5,Number(rating)||0)
  );

  return "★".repeat(n)+"☆".repeat(5-n);
}

function renderReviews(data){

  if(!data || !data.count){

    return `
      <div class="reviews-summary">
        <div class="reviews-score">
          <div class="reviews-score-number">0.0</div>
          <div>
            <div class="reviews-stars">☆☆☆☆☆</div>
            <div class="reviews-count">
              Пока нет отзывов
            </div>
          </div>
        </div>
      </div>
    `;

  }

  return `
    <div class="reviews-summary">

      <div class="reviews-score">

        <div class="reviews-score-number">
          ${Number(data.average).toFixed(1)}
        </div>

        <div>
          <div class="reviews-stars">
            ${reviewStars(data.average)}
          </div>

          <div class="reviews-count">
            ${Number(data.count)} отзывов
          </div>
        </div>

      </div>

    </div>

    ${data.reviews.map(r=>`

      <div class="review-card">

        <div class="review-head">

          <div class="review-author">
            ${esc(r.first_name || r.username || "Пользователь")}
          </div>

          <div class="review-date">
            ${esc(
              String(r.created_at || "")
                .slice(0,10)
            )}
          </div>

        </div>

        <div class="review-rating">
          ${reviewStars(r.rating)}
        </div>

        ${
          r.text
          ? `
            <div class="review-text">
              ${esc(r.text)}
            </div>
          `
          : ""
        }

      </div>

    `).join("")}
  `;
}

async function openTrade(tradeId,type){

  const u=user();

  const res=await fetch(
    API+"/api/trades?user_id="+
    encodeURIComponent(u.id)
  );

  const data=await res.json();

  const trades=Array.isArray(data)
    ? data
    : (data.trades || []);

  const t=trades.find(
    x=>Number(x.id)===Number(tradeId)
  );

  if(!t){
    toast("Сделка не найдена");
    return;
  }

  const buyer=
    Number(t.buyer_id)===Number(u.id);

  const content=document.getElementById(
    "modalContent"
  );

  content.innerHTML=`

    <h2>🤝 Сделка #${Number(t.id)}</h2>

    <div class="info">
      <b>Статус</b><br>
      ${tradeStatus(t.status)}
    </div>

    <div class="info">
      <b>Сумма</b><br>
      ${esc(t.amount)} ${esc(t.currency)}
    </div>

    <div class="info">
      <b>Объявление</b><br>
      #${Number(t.listing_id)}
    </div>

    ${
      t.tx_hash
      ? `
        <div class="info">
          <b>Хэш транзакции</b><br>
          <span style="word-break:break-all">
            ${esc(t.tx_hash)}
          </span>
        </div>
      `
      : ""
    }

    ${tradeActions(t,type,buyer)}

  `;

  document.getElementById("modal")
    .classList.add("show");
}


function tradeActions(t,type,buyer){

  const id=Number(t.id);

  if(t.status==="pending"){

    if(buyer){

      return `
        <button
          class="primary"
          onclick="showTradeInfo(${id})"
        >
          💳 Оплатить и отправить транзакцию
        </button>

        <div class="info">
          После оплаты отправь хэш транзакции
          для проверки.
        </div>
      `;
    }

    return `
      <div class="info">
        ⏳ Ожидается оплата покупателя.
      </div>
    `;
  }


  if(t.status==="paid" && !buyer){

    return `
      <button
        class="primary"
        onclick="changeTradeStatus(${id},'delivered')"
      >
        📦 Передать товар
      </button>
    `;
  }


  if(t.status==="delivered" && buyer){

    return `
      <button
        class="primary"
        onclick="changeTradeStatus(${id},'completed')"
      >
        ✅ Подтвердить получение
      </button>
    `;
  }


  if(t.status==="completed"){

    return `
      <div class="info">
        ✅ Сделка завершена
      </div>
    `;
  }

  return "";
}


async function changeTradeStatus(id,status){

  try{

    const res=await fetch(
      API+"/api/trades/status",
      {
        method:"PATCH",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          trade_id:Number(id),
          user_id:Number(user().id),
          status
        })
      }
    );

    const data=await res.json();

    if(!res.ok || !data.ok){
      toast(data.error || "Нельзя изменить статус");
      return;
    }

    toast("Статус обновлён");
    closeModal();

  }catch(e){

    toast("Ошибка соединения");

  }
}


function tradeStatus(status){

  const map={
    pending:"⏳ Ожидает оплаты",
    paid:"💳 Оплата подтверждена",
    delivered:"📦 Товар передан",
    completed:"✅ Завершено",
    cancelled:"❌ Отменено"
  };

  return map[status] || status || "Неизвестно";
}


async function createListing(){

  const u=user();

  const title=document.getElementById("sellTitle").value.trim();
  const category=document.getElementById("sellCategory").value;
  const amount=document.getElementById("sellAmount").value.trim() || "1";
  const price=document.getElementById("sellPrice").value.trim();
  const currency=document.getElementById("sellCurrency").value;
  const description=document.getElementById("sellDesc").value.trim();

  if(!title || !price){
    toast("Заполни название и цену");
    return;
  }

  try{

    const res=await fetch(API+"/api/listings",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        seller_id:Number(u.id),
        title,
        category,
        amount,
        price,
        currency,
        description
      })
    });

    const data=await res.json();

      toast(data.error || "Ошибка публикации");

async function loadProfile(){

  const u=user();

  document.getElementById("profileName").textContent =
    u.first_name || "Игрок";

  document.getElementById("profileUsername").textContent =
    u.username ? "@"+u.username : "Telegram";

  document.getElementById("avatar").textContent =
    (u.first_name || "И")
      .charAt(0)
      .toUpperCase();

  await loadWallets();
  updateProfileStats();
}


function updateProfileStats(){

  const u=user();

  document.getElementById("favCount").textContent =
    favorites.length;

  const mine=listings.filter(
    x=>Number(x.seller_id)===Number(u.id)
  );

  document.getElementById("myListings").textContent =
    mine.length;

  fetch(
    API+"/api/trades?user_id="+
    encodeURIComponent(u.id)
  )
  .then(r=>r.json())
  .then(d=>{

    const trades=Array.isArray(d.trades)
      ? d.trades
      : [];

    document.getElementById("tradeCount")
      .textContent=trades.length;

  })
  .catch(()=>{});
}


let chatTimer=null;
let chatLoading=false;


function getChatUser(){

  const u=tg?.initDataUnsafe?.user;

  return {
    id:u?.id || 123,
    username:u?.username || "",
    first_name:u?.first_name || "Пользователь",
    photo_url:u?.photo_url || ""
  };
}


function openPublicChat(){

  const overlay=
    document.getElementById(
      "publicChatOverlay"
    );

  overlay.classList.add("active");

  loadPublicChat(true);

  if(chatTimer)
    clearInterval(chatTimer);

  chatTimer=setInterval(
    ()=>loadPublicChat(false),
    2000
  );
}


function closePublicChat(){

  document.getElementById(
    "publicChatOverlay"
  ).classList.remove("active");

  if(chatTimer){

    clearInterval(chatTimer);
    chatTimer=null;

  }
}


async function loadPublicChat(force){

  if(chatLoading) return;

  chatLoading=true;

  try{

    const u=getChatUser();

    const res=await fetch(
      API+"/api/chat?user_id="+
      encodeURIComponent(u.id),
      {cache:"no-store"}
    );

    const data=await res.json();

    const box=document.getElementById(
      "publicChatMessages"
    );

    if(!data.ok || !data.messages.length){

      box.innerHTML=
        '<div class="empty">Пока сообщений нет.<br>Напиши первым 👋</div>';

      return;
    }

    box.innerHTML=data.messages.map(m=>{

      const mine=
        Number(m.user_id)===Number(u.id);

      const name=
        esc(m.first_name || "Пользователь");

      const avatar=m.photo_url
        ? `<img src="${esc(m.photo_url)}">`
        : esc(
            (m.first_name || "П")
              .charAt(0)
              .toUpperCase()
          );

      return `

        <div class="chat-row ${mine?"mine":""}">

          ${mine?"":`
            <div class="chat-avatar">
              ${avatar}
            </div>
          `}

          <div class="chat-content">

            ${mine?"":`
              <div class="chat-user">
                ${name}
                ${
                  m.username
                  ? `<span style="opacity:.6">@${esc(m.username)}</span>`
                  : ""
                }
              </div>
            `}

            <div class="chat-msg">

              ${esc(m.text)}

              <span class="chat-time">
                ${chatTime(m.created_at)}
              </span>

            </div>

          </div>

          ${mine?`
            <div class="chat-avatar">
              ${avatar}
            </div>
          `:""}

        </div>
      `;

    }).join("");

    requestAnimationFrame(()=>{
      const near=
        box.scrollHeight-
        box.scrollTop-
        box.clientHeight<150;

      if(force || near)
        box.scrollTop=box.scrollHeight;
    });

  }catch(e){

    console.error(e);

  }finally{

    chatLoading=false;

  }
}


async function sendPublicMessage(){

  const input=
    document.getElementById(
      "publicChatInput"
    );

  const text=input.value.trim();

  if(!text) return;

  const u=getChatUser();

  input.disabled=true;

  try{

    const res=await fetch(
      API+"/api/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          user_id:u.id,
          username:u.username,
          first_name:u.first_name,
          photo_url:u.photo_url,
          text
        })
      }
    );

    const data=await res.json();

    if(!res.ok || !data.ok){

      toast(
        data.error ||
        "Не удалось отправить сообщение"
      );

      return;
    }

    input.value="";

    await loadPublicChat(true);

    input.focus();

  }catch(e){

    toast("Ошибка подключения к чату");

  }finally{

    input.disabled=false;

  }
}


function chatTime(value){

  if(!value) return "";

  const d=new Date(
    String(value).replace(" ","T")+"Z"
  );

  if(isNaN(d.getTime())) return "";

  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}
