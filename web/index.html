<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070812">
<title>Atlantida Market</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#060711;color:#f7f8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}

body:before{
 content:"";position:fixed;inset:-30%;z-index:-2;
 background:
 radial-gradient(circle at 15% 10%,rgba(0,190,255,.20),transparent 25%),
 radial-gradient(circle at 85% 15%,rgba(128,55,255,.20),transparent 27%),
 radial-gradient(circle at 50% 90%,rgba(0,115,255,.12),transparent 30%);
 animation:ambient 10s ease-in-out infinite alternate
}
body:after{
 content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(120deg,transparent,rgba(255,255,255,.025),transparent)
}
@keyframes ambient{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.06)}}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;color:inherit}
a{color:inherit;text-decoration:none}

#app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:92px}

.topbar{
 position:sticky;top:0;z-index:20;
 padding:14px 15px 12px;
 backdrop-filter:blur(22px);
 background:rgba(6,7,17,.72);
 border-bottom:1px solid rgba(255,255,255,.07)
}
.brand{
 display:flex;align-items:center;justify-content:space-between;gap:12px
}
.logo{
 font-size:22px;font-weight:900;letter-spacing:-.7px;
 background:linear-gradient(90deg,#fff,#58dcff,#9d6cff);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.badge{
 padding:7px 11px;border-radius:999px;
 background:linear-gradient(135deg,rgba(0,212,255,.16),rgba(132,75,255,.18));
 border:1px solid rgba(105,205,255,.18);
 color:#a9eaff;font-size:11px;font-weight:800
}

.hero{
 margin:16px 15px;
 padding:23px 20px;
 border-radius:27px;
 position:relative;overflow:hidden;
 background:
 linear-gradient(135deg,rgba(16,20,43,.94),rgba(18,11,40,.90));
 border:1px solid rgba(140,150,255,.16);
 box-shadow:0 18px 55px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.07)
}
.hero:before{
 content:"";position:absolute;width:210px;height:210px;border-radius:50%;
 right:-80px;top:-100px;
 background:radial-gradient(circle,rgba(72,210,255,.35),transparent 68%);
 filter:blur(5px)
}
.hero:after{
 content:"";position:absolute;width:170px;height:170px;border-radius:50%;
 left:-90px;bottom:-120px;
 background:radial-gradient(circle,rgba(135,63,255,.3),transparent 68%)
}
.hero h1{position:relative;margin:0 0 8px;font-size:30px;line-height:1.05;letter-spacing:-1.2px}
.hero p{position:relative;margin:0;color:#aeb3c8;font-size:14px;line-height:1.5}
.hero-glow{
 position:absolute;right:20px;bottom:18px;width:9px;height:9px;border-radius:50%;
 background:#52e5ff;box-shadow:0 0 22px 8px rgba(0,210,255,.4)
}

.searchbox{
 margin:0 15px 14px;position:relative
}
.searchbox input{
 width:100%;height:49px;border-radius:17px;padding:0 17px 0 45px;
 color:#fff;outline:0;
 background:rgba(19,21,35,.78);
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 10px 30px rgba(0,0,0,.18);
 backdrop-filter:blur(15px)
}
.searchbox input:focus{border-color:rgba(65,210,255,.42);box-shadow:0 0 0 3px rgba(65,210,255,.07)}
.searchbox:before{content:"⌕";position:absolute;left:17px;top:9px;font-size:24px;color:#77819b;z-index:2}

.section{
 padding:0 15px;margin:20px 0
}
.section-title{
 display:flex;align-items:center;justify-content:space-between;margin-bottom:11px
}
.section-title h2{font-size:17px;margin:0;letter-spacing:-.3px}
.section-title span{font-size:12px;color:#777f99}

#homeCats,#catalogCats{
 display:flex;gap:9px;overflow-x:auto;padding:2px 1px 7px;
 scrollbar-width:none
}
#homeCats::-webkit-scrollbar,#catalogCats::-webkit-scrollbar{display:none}

.cat{
 flex:0 0 auto;padding:10px 14px;border-radius:14px;
 color:#aab1c8;font-size:12px;font-weight:800;
 background:rgba(19,22,37,.72);
 border:1px solid rgba(255,255,255,.07);
 transition:.2s
}
.cat:hover,.cat.active{
 color:#fff;border-color:rgba(68,214,255,.35);
 background:linear-gradient(135deg,rgba(0,190,255,.16),rgba(125,66,255,.16));
 box-shadow:0 7px 24px rgba(0,174,255,.08)
}

.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px
}
.card{
 min-width:0;padding:15px;border-radius:21px;
 background:linear-gradient(145deg,rgba(20,23,39,.92),rgba(12,14,27,.88));
 border:1px solid rgba(255,255,255,.075);
 box-shadow:0 14px 35px rgba(0,0,0,.23);
 transition:transform .18s,border-color .18s,box-shadow .18s;
 position:relative;overflow:hidden
}
.card:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.055),transparent 30%)
}
.card:hover{
 transform:translateY(-2px);
 border-color:rgba(80,210,255,.25);
 box-shadow:0 18px 42px rgba(0,0,0,.34),0 0 25px rgba(70,170,255,.06)
}
.card>*{position:relative}
.card-title{font-size:14px;font-weight:850;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:11px;color:#8189a0;min-height:31px;line-height:1.4}
.card-price{
 margin-top:12px;font-size:18px;font-weight:900;
 background:linear-gradient(90deg,#55e5ff,#a276ff);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.card-meta{font-size:10px;color:#68718a;margin-top:5px}

.empty{
 padding:28px 15px;text-align:center;color:#6f7892;
 border:1px dashed rgba(255,255,255,.08);border-radius:19px
}

input,textarea,select{
 background:#111425;color:#fff;border:1px solid rgba(255,255,255,.09);
 border-radius:14px;padding:12px;outline:0
}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:rgba(71,211,255,.4)}

.btn{
 min-height:44px;padding:0 16px;border-radius:14px;font-weight:850;
 background:linear-gradient(135deg,#13c8f5,#6758ff);
 box-shadow:0 10px 28px rgba(45,146,255,.18);
 transition:.18s
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.secondary{
 background:rgba(255,255,255,.055);box-shadow:none;
 border:1px solid rgba(255,255,255,.08)
}

#modal,#publicChatOverlay{
 background:rgba(2,3,9,.78)!important;
 backdrop-filter:blur(18px)!important
}
#modalContent{
 background:linear-gradient(145deg,#15192b,#0c0e1b)!important;
 border:1px solid rgba(132,150,255,.18)!important;
 box-shadow:0 25px 90px rgba(0,0,0,.65)!important;
 border-radius:27px!important
}

.bottom-nav{
 position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
 width:min(690px,calc(100% - 24px));z-index:30;
 display:flex;justify-content:space-around;align-items:center;
 padding:8px;
 border-radius:22px;
 background:rgba(13,15,28,.84);
 border:1px solid rgba(255,255,255,.08);
 backdrop-filter:blur(24px);
 box-shadow:0 18px 55px rgba(0,0,0,.45)
}
.bottom-nav button{
 flex:1;background:transparent;color:#747d97;padding:8px 3px;
 border-radius:16px;font-size:10px;font-weight:800
}
.bottom-nav button:hover{
 color:#fff;background:rgba(255,255,255,.05)
}
.bottom-nav .main{
 color:#61ddff;
 background:linear-gradient(135deg,rgba(0,195,255,.12),rgba(128,67,255,.12))
}

.toast{
 border:1px solid rgba(100,220,255,.18)!important;
 background:rgba(13,17,31,.94)!important;
 box-shadow:0 12px 40px rgba(0,0,0,.45)!important;
 backdrop-filter:blur(20px)
}

@media(max-width:430px){
 #app{padding-bottom:88px}
 .hero{padding:20px 17px;border-radius:23px}
 .hero h1{font-size:27px}
 .grid{gap:9px}
 .card{padding:13px;border-radius:18px}
}

/* PREMIUM TRADE UI */

#modalContent h2{
  margin:0 0 18px;
  font-size:24px;
  font-weight:900;
  letter-spacing:-.4px;
}

#modalContent .info{
  margin:10px 0;
  padding:14px 15px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.075);
  color:#aeb7ce;
  line-height:1.5;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}

#modalContent .info b{
  color:#fff;
  font-weight:850;
}

#modalContent #txHash{
  width:100%!important;
  margin-top:12px!important;
  min-height:50px;
  padding:14px 15px!important;
  border:1px solid rgba(100,180,255,.16)!important;
  border-radius:16px!important;
  outline:none;
  background:rgba(5,8,18,.72)!important;
  color:#fff!important;
  font-size:14px;
  transition:.2s;
  box-shadow:inset 0 1px 8px rgba(0,0,0,.18);
}

#modalContent #txHash::placeholder{
  color:#68738d;
}

#modalContent #txHash:focus{
  border-color:rgba(64,205,255,.55)!important;
  box-shadow:
    0 0 0 3px rgba(39,196,255,.08),
    0 8px 30px rgba(0,0,0,.2);
}

#modalContent .primary{
  width:100%;
  min-height:50px;
  margin-top:12px!important;
  border-radius:16px;
  font-weight:850;
  background:linear-gradient(135deg,#13c8f5,#6758ff);
  box-shadow:
    0 10px 30px rgba(54,125,255,.22),
    inset 0 1px 0 rgba(255,255,255,.18);
  transition:.2s;
}

#modalContent .primary:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

#modalContent .primary:active{
  transform:translateY(1px) scale(.99);
}

#modalContent .info:first-of-type{
  border-color:rgba(40,205,255,.12);
}

@media(max-width:430px){
  #modalContent{
    border-radius:23px!important;
    padding:20px!important;
  }

  #modalContent h2{
    font-size:21px;
  }
}




/* PREMIUM REVIEWS UI */

.reviews-summary{
  margin:14px 0;
  padding:18px;
  border-radius:20px;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,194,70,.14),transparent 45%),
    linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
}

.reviews-score{
  display:flex;
  align-items:center;
  gap:12px;
}

.reviews-score-number{
  font-size:32px;
  font-weight:950;
  letter-spacing:-1px;
  color:#fff;
}

.reviews-stars{
  color:#ffd45c;
  font-size:18px;
  letter-spacing:1px;
}

.reviews-count{
  margin-top:5px;
  color:#7e8aa5;
  font-size:12px;
}

.review-card{
  margin:10px 0;
  padding:15px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.065);
}

.review-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.review-author{
  color:#fff;
  font-size:13px;
  font-weight:850;
}

.review-date{
  color:#66728d;
  font-size:10px;
}

.review-rating{
  margin-top:7px;
  color:#ffd45c;
  font-size:14px;
}

.review-text{
  margin-top:9px;
  color:#aeb7ce;
  font-size:13px;
  line-height:1.5;
}

.review-form{
  margin-top:14px;
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.065);
}

.review-form textarea{
  width:100%;
  min-height:90px;
  margin-top:10px;
  padding:13px;
  resize:vertical;
  border-radius:15px;
  border:1px solid rgba(100,180,255,.14);
  background:rgba(5,8,18,.7);
  color:#fff;
  outline:none;
  box-sizing:border-box;
}

.review-form textarea:focus{
  border-color:rgba(64,205,255,.5);
}

.review-stars-select{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.review-star{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#68738d;
  border-radius:12px;
  width:42px;
  height:40px;
  font-size:18px;
  cursor:pointer;
}

.review-star.active{
  color:#ffd45c;
  border-color:rgba(255,212,92,.35);
  background:rgba(255,212,92,.08);
}

@media(max-width:430px){
  .reviews-score-number{
    font-size:28px;
  }
}

/* PREMIUM TRADE DETAILS */

.trade-detail-hero{
  margin:4px 0 16px;
  padding:20px;
  border-radius:22px;
  background:
    radial-gradient(circle at 100% 0%,rgba(35,190,255,.16),transparent 42%),
    linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 15px 45px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.trade-detail-label{
  color:#7d89a5;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.trade-detail-amount{
  margin-top:7px;
  font-size:30px;
  font-weight:950;
  letter-spacing:-.8px;
  background:linear-gradient(90deg,#fff,#75e5ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.trade-detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0;
}

.trade-detail-item{
  padding:14px;
  border-radius:17px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.065);
}

.trade-detail-item span{
  display:block;
  color:#71809c;
  font-size:11px;
  margin-bottom:5px;
}

.trade-detail-item b{
  color:#fff;
  font-size:13px;
}

.trade-detail-actions{
  margin-top:15px;
}

@media(max-width:430px){
  .trade-detail-grid{
    grid-template-columns:1fr;
  }

  .trade-detail-amount{
    font-size:27px;
  }
}

/* PREMIUM TRADE CARDS */

.trade-card{
  position:relative;
  margin:10px 0;
  padding:16px;
  border-radius:20px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 12px 35px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.035);
  cursor:pointer;
  transition:.2s ease;
  overflow:hidden;
}

.trade-card:before{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  right:-55px;
  top:-55px;
  border-radius:50%;
  background:rgba(35,190,255,.12);
  filter:blur(20px);
  pointer-events:none;
}

.trade-card:hover{
  transform:translateY(-2px);
  border-color:rgba(75,205,255,.2);
  box-shadow:0 16px 42px rgba(0,0,0,.3);
}

.trade-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.trade-card-title{
  font-size:15px;
  font-weight:900;
}

.trade-card-id{
  color:#71809c;
  font-size:11px;
  font-weight:700;
}

.trade-card-price{
  margin-top:13px;
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
  background:linear-gradient(90deg,#fff,#7ce6ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.trade-card-meta{
  margin-top:5px;
  color:#7e8aa5;
  font-size:12px;
}

.trade-card-status{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid rgba(255,255,255,.055);
  font-size:12px;
  font-weight:800;
}


/* ===== MARKETPLACE UPGRADE ===== */

.seller-profile{
  margin:14px 0;
  padding:18px;
  border-radius:22px;
  background:
    radial-gradient(circle at 100% 0%,rgba(65,210,255,.14),transparent 42%),
    linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);
}

.seller-profile-head{
  display:flex;
  align-items:center;
  gap:13px;
}

.seller-avatar{
  width:52px;
  height:52px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:900;
  background:linear-gradient(135deg,#13c8f5,#6758ff);
  box-shadow:0 10px 28px rgba(45,150,255,.22);
}

.seller-name{
  color:#fff;
  font-size:16px;
  font-weight:900;
}

.seller-username{
  margin-top:3px;
  color:#74819b;
  font-size:12px;
}

.seller-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}

.seller-stat{
  padding:11px 8px;
  text-align:center;
  border-radius:15px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
}

.seller-stat b{
  display:block;
  color:#fff;
  font-size:15px;
}

.seller-stat span{
  display:block;
  margin-top:3px;
  color:#6f7b95;
  font-size:10px;
}

.market-filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 0 10px;
  scrollbar-width:none;
}

.market-filters::-webkit-scrollbar{
  display:none;
}

.market-filter{
  flex:0 0 auto;
  padding:9px 13px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.035);
  color:#9ca8bf;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.market-filter.active{
  color:#fff;
  border-color:rgba(65,205,255,.3);
  background:rgba(35,190,255,.1);
}

.product-seller-mini{
  margin-top:7px;
  color:#77839d;
  font-size:11px;
}

.product-rating-mini{
  margin-top:5px;
  color:#ffd45c;
  font-size:11px;
}

.seller-link{
  display:block;
  margin-top:8px;
  padding:11px 13px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
  color:#8ee9ff;
  text-align:center;
  font-size:12px;
  font-weight:850;
  cursor:pointer;
}

@media(max-width:430px){
  .seller-stats{
    grid-template-columns:1fr 1fr 1fr;
  }
}


.buy-card-btn{
  display:block !important;
  width:100%;
  margin-top:10px;
  min-height:42px;
  padding:10px 14px;
  border:0;
  border-radius:13px;
  background:#ffffff;
  color:#000000;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  position:relative;
  z-index:5;
}
.buy-card-btn:active{
  transform:scale(.98);
}


/* ===== ATLANTIDA PROFILE ===== */

.profile-page{
  display:none;
  padding:18px 14px 110px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:14px;
  padding:20px;
  border-radius:22px;
  background:linear-gradient(135deg,rgba(35,190,255,.12),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:12px;
}

.profile-avatar-wrap{
  width:64px;
  height:64px;
  flex:none;
}

.profile-avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(100,220,255,.35);
  font-size:30px;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-main{
  min-width:0;
}

.profile-name{
  font-size:20px;
  font-weight:950;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-username{
  margin-top:4px;
  color:#7f8ba5;
  font-size:13px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:12px;
}

.profile-stat{
  padding:15px 8px;
  text-align:center;
  border-radius:18px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
}

.profile-stat b{
  display:block;
  font-size:20px;
  color:#fff;
}

.profile-stat span{
  display:block;
  margin-top:4px;
  color:#77839d;
  font-size:11px;

<script>

const API = "https://atlantidamarket.onrender.com";

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


let listings = [];
let category = "Все";

let favorites = JSON.parse(
  localStorage.getItem("atlantida_favorites") || "[]"
);


const CATEGORIES = [
  ["Все","🌐"],
  ["gifts","🎁"],
  ["stars","⭐"],
  ["nft","💎"],
  ["ton","💠"],
  ["crypto","🪙"],
  ["other","📦"]
];


function user(){
  return tg?.initDataUnsafe?.user || {
    id: 0,
    first_name: "Игрок",
    username: "demo"
  };
}


function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function toast(text){
  const x=document.getElementById("toast");

  x.textContent=text;
  x.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    x.style.display="none";
  },2200);
}


function showPage(page){

  const hero=document.querySelector(".hero");
  const search=document.querySelector(".searchbox");
  const sections=document.querySelectorAll(
    ".section:not(#sellSection):not(#profileSection)"
  );

  const sellSection=document.getElementById("sellSection");
  const profileSection=document.getElementById("profileSection");

  const homeGrid=document.getElementById("homeGrid");
  const catalogGrid=document.getElementById("catalogGrid");
  const favGrid=document.getElementById("favGrid");

  const homeCats=document.getElementById("homeCats");
  const catalogCats=document.getElementById("catalogCats");
  const marketFilters=document.getElementById("marketFilters");

  /* bottom navigation */

  document.querySelectorAll(".bottom-nav button").forEach((btn,i)=>{

    btn.classList.toggle(
      "active",

      (page==="home" && i===0) ||
      (page==="catalog" && i===1) ||
      (page==="favorites" && i===2) ||
      (page==="sell" && i===3) ||
      (page==="profile" && i===4)
    );

  });


  /* hide home */

  if(hero)
    hero.style.display=page==="home" ? "" : "none";

  if(search)
    search.style.display=
      page==="home" || page==="catalog"
        ? ""
        : "none";


  /* normal sections */

  sections.forEach(section=>{

    section.style.display=
      page==="home" || page==="catalog"
        ? ""
        : "none";

  });


  /* home */

  if(homeGrid)
    homeGrid.style.display=
      page==="home" ? "" : "none";

  if(homeCats)
    homeCats.style.display=
      page==="home" ? "" : "none";


  /* catalog */

  if(catalogGrid)
    catalogGrid.style.display=
      page==="catalog" ? "" : "none";

  if(catalogCats)
    catalogCats.style.display=
      page==="catalog" ? "" : "none";

  if(marketFilters)
    marketFilters.style.display=
      page==="catalog" ? "flex" : "none";


  /* favorites */

  if(favGrid){

    favGrid.style.display=
      page==="favorites" ? "block" : "none";

    if(page==="favorites")
      renderFavorites();

  }


  /* sell */

  if(sellSection)
    sellSection.style.display=
      page==="sell" ? "block" : "none";


  /* profile */

  if(profileSection){

    profileSection.style.display=
      page==="profile" ? "block" : "none";

    if(page==="profile")
      loadProfile();

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  if(page==="catalog")
    loadListings();

}

function categoryIcon(c){
  const x=CATEGORIES.find(v=>v[0]===c);
  return x ? x[1] : "📦";
}


function renderCategories(){

  const make = id => {

    const box=document.getElementById(id);

    if(!box) return;

    box.innerHTML=CATEGORIES.map(c=>`
      <button
        class="cat ${category===c[0]?"active":""}"
        onclick="setCategory('${c[0]}')"
      >
        ${c[1]} ${c[0]==="Все"?"Все":c[0].toUpperCase()}
      </button>
    `).join("");
  };

  make("homeCats");
  make("catalogCats");
}


function setCategory(c){
  category=c;
  showPage("catalog");
  renderCategories();
  loadListings();
}


async function loadListings(){

  renderCategories();

  const search=document.getElementById("search")?.value.trim() || "";

  try{

    const url =
      API +
      "/api/listings?category=" +
      encodeURIComponent(category) +
      "&search=" +
      encodeURIComponent(search);

    const res=await fetch(url,{cache:"no-store"});
    const data=await res.json();

    listings=Array.isArray(data.listings)
      ? data.listings
      : [];

    render();

  }catch(e){

    console.error(e);

    listings=[];

    render();

  }
}



let marketCurrencyFilter="all";

function setMarketFilter(currency,button){

  marketCurrencyFilter=String(currency||"all").toUpperCase();

  document.querySelectorAll(".market-filter")
    .forEach(x=>x.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  render();
}

function render(){
  const sourceListings =
    marketCurrencyFilter==="all"
      ? listings
      : listings.filter(x=>
          String(x.currency||"").toUpperCase()===
          marketCurrencyFilter
        );



  const catalog=document.getElementById("catalogGrid");
  const home=document.getElementById("homeGrid");

  document.getElementById("count").textContent =
    sourceListings.length + " товаров";

  if(!sourceListings.length){

    catalog.innerHTML=
      '<div class="empty">📦<br><br>Товаров пока нет</div>';

    home.innerHTML=
      '<div class="empty">Пока нет объявлений</div>';

    return;
  }


  const html=sourceListings.map(card).join("");

  catalog.innerHTML=html;
  home.innerHTML=listings.slice(0,6).map(card).join("");

  updateProfileStats();
}


function card(x){

  const fav=favorites.includes(Number(x.id));

  return `
    <div class="card" onclick="openProduct(${Number(x.id)})">

      <button
        class="fav"
        onclick="event.stopPropagation();toggleFavorite(${Number(x.id)})"
      >
        ${fav?"❤️":"♡"}
      </button>

      <div class="card-icon">
        ${categoryIcon(x.category)}
      </div>

      <h3>${esc(x.title || x.name)}</h3>

      <div class="meta">
        ${esc(x.amount || "1")} • ${esc(x.category)}
      </div>

      <div class="price">
        ${esc(x.price)} ${esc(x.currency || "TON")}
      </div>

      <button
        class="buy-card-btn"
        type="button"
        onclick="event.stopPropagation();createTrade(${Number(x.id)})"
      >
        🛒 Купить
      </button>

    </div>
  `;
}

function toggleFavorite(id){

  id=Number(id);

  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
    toast("Удалено из избранного");
  }else{
    favorites.push(id);
    toast("❤️ Добавлено в избранное");
  }

  localStorage.setItem(
    "atlantida_favorites",
    JSON.stringify(favorites)
  );

  render();
  renderFavorites();
  updateProfileStats();
}


function renderFavorites(){

  const box=document.getElementById("favGrid");

  if(!box) return;

  const favListings=listings.filter(x =>
    favorites.includes(Number(x.id))
  );

  if(!favListings.length){

    box.innerHTML=`
      <div class="favorites-header">
        <div class="favorites-title">Избранное</div>
        <div class="favorites-subtitle">
          Сохранённые товары будут отображаться здесь
        </div>
      </div>

      <div class="favorites-empty">

        <div class="favorites-empty-icon">♡</div>

        <div class="favorites-empty-title">
          В избранном пока пусто
        </div>

        <div class="favorites-empty-text">
          Нажимай на ♡ возле товара, чтобы сохранить его здесь.
        </div>

        <button type="button" onclick="showPage('catalog')">
          Открыть каталог
        </button>

      </div>
    `;

    return;
  }

  box.innerHTML=`
    <div class="favorites-header">
      <div class="favorites-title">Избранное</div>

      <div class="favorites-subtitle">
        ${favListings.length}
        ${favListings.length===1?"сохранённый товар":
          favListings.length<5?"сохранённых товара":
          "сохранённых товаров"}
      </div>
    </div>

    <div class="grid">
      ${favListings.map(card).join("")}
    </div>
  `;
}


async function loadProfile(){

  const u=user();

  const name=[
    u.first_name,
    u.last_name
  ].filter(Boolean).join(" ") || "Игрок";

  const username=u.username
    ? "@"+u.username
    : "Telegram пользователь";

  const nameBox=document.getElementById("profileName");
  const usernameBox=document.getElementById("profileUsername");
  const avatarBox=document.getElementById("avatar");

  if(nameBox)
    nameBox.textContent=name;

  if(usernameBox)
    usernameBox.textContent=username;

  if(avatarBox){

    if(u.photo_url){

      avatarBox.innerHTML=
        `<img src="${esc(u.photo_url)}" alt="">`;

    }else{

      avatarBox.textContent=
        (name.trim()[0] || "👤").toUpperCase();

    }
  }

  const mine=listings.filter(x =>
    Number(x.seller_id)===Number(u.id)
  );

  const myListings=document.getElementById("myListings");

  if(myListings)
    myListings.textContent=mine.length;

  const profileListings=
    document.getElementById("profileListings");

  if(profileListings){

    if(!mine.length){

      profileListings.innerHTML=`
        <div class="profile-empty">
          📦 У тебя пока нет объявлений
        </div>
      `;

    }else{

      profileListings.innerHTML=
        mine.slice(0,10).map(x=>`

          <div
            class="profile-listing"
            onclick="openProduct(${Number(x.id)})"
          >

            <div class="profile-listing-icon">
              ${categoryIcon(x.category)}
            </div>

            <div class="profile-listing-info">

              <div class="profile-listing-title">
                ${esc(x.title || x.name || "Товар")}
              </div>

              <div class="profile-listing-price">
                ${esc(x.price)}
                ${esc(x.currency || "TON")}
              </div>

            </div>

            <strong>›</strong>

          </div>

        `).join("");
    }
  }

  await loadWallets();

  updateProfileStats();
}


function updateProfileStats(){

  const fav=document.getElementById("favCount");

  if(fav)
    fav.textContent=favorites.length;

  const trades=document.getElementById("tradeCount");

  if(trades){

    const saved=Number(
      localStorage.getItem("atlantida_trade_count") || 0
    );

    trades.textContent=saved;
  }
}



function closeModal(){
  document.getElementById("modal")
    .classList.remove("show");
}


async function createTrade(listingId){

  const u=user();

  try{

    const res=await fetch(API+"/api/trades",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        listing_id:Number(listingId),
        buyer_id:Number(u.id)
      })
    });

    const data=await res.json();

    if(!res.ok || !data.ok){
      toast(data.error || "Не удалось создать сделку");
      return;
    }

    closeModal();

    toast("Сделка создана");

    showTradeInfo(data.trade_id);

  }catch(e){

    toast("Ошибка соединения");

  }
}


async function showTradeInfo(tradeId){

  const u=user();

  const modal=document.getElementById("modal");
  const content=document.getElementById("modalContent");

  content.innerHTML=`
    <h2>🤝 Сделка #${tradeId}</h2>
    <div class="info">
      ⏳ Сделка создана.<br><br>
      Ожидается оплата.
    </div>

    <div class="info">
      После оплаты укажи хэш транзакции,
      чтобы его можно было проверить.
    </div>

    <input
      id="txHash"
      placeholder="Хэш транзакции"
      style="width:100%;margin-top:10px;border:1px solid #26394f;background:#101d2d;color:#fff;border-radius:12px;padding:12px"
    >

    <button
      class="primary"
      style="margin-top:10px"
      onclick="submitTx(${tradeId})"
    >
      Отправить транзакцию на проверку
    </button>
  `;

  modal.classList.add("show");
}


async function submitTx(tradeId){

  const hash=document.getElementById("txHash")
    ?.value.trim();

  if(!hash){
    toast("Укажи хэш транзакции");
    return;
  }

  try{

function reviewStars(rating){

  const n=Math.max(
    0,
    Math.min(5,Number(rating)||0)
  );

  return "★".repeat(n)+"☆".repeat(5-n);
}

function tradeActions(t,type,buyer){

  const id=Number(t.id);

  if(t.status==="pending"){

    if(buyer){

      return `
        <button
          class="primary"
          onclick="showTradeInfo(${id})"
        >
          💳 Оплатить и отправить транзакцию
        </button>

        <div class="info">
          После оплаты отправь хэш транзакции
          для проверки.
        </div>
      `;
    }

    return `
      <div class="info">
        ⏳ Ожидается оплата покупателя.
      </div>
    `;
  }

  if(t.status==="paid" && !buyer){

    return `
      <button
        class="primary"
        onclick="changeTradeStatus(${id},'delivered')"
      >
        📦 Передать товар
      </button>
    `;
  }

  if(t.status==="delivered" && buyer){

    return `
      <button
        class="primary"
        onclick="changeTradeStatus(${id},'completed')"
      >
        ✅ Подтвердить получение
      </button>
    `;
  }

  if(t.status==="completed"){

    if(buyer){

      return `
        <div class="info">
          <b>✅ Сделка завершена</b><br>
          Товар получен. Теперь можно оставить отзыв продавцу.
        </div>

        <div class="review-form">

          <b>⭐ Оценка продавца</b>

          <div class="review-stars-select">

            <button
              class="review-star"
              onclick="selectReviewStar(1)"
              type="button"
              id="reviewStar1"
            >★</button>

            <button
              class="review-star"
              onclick="selectReviewStar(2)"
              type="button"
              id="reviewStar2"
            >★</button>

            <button
              class="review-star"
              onclick="selectReviewStar(3)"
              type="button"
              id="reviewStar3"
            >★</button>

            <button
              class="review-star"
              onclick="selectReviewStar(4)"
              type="button"
              id="reviewStar4"
            >★</button>

            <button
              class="review-star"
              onclick="selectReviewStar(5)"
              type="button"
              id="reviewStar5"
            >★</button>

          </div>

          <textarea
            id="reviewText"
            placeholder="Напиши отзыв о продавце..."
            maxlength="500"
          ></textarea>

          <button
            class="primary"
            onclick="submitReview(${id},${Number(t.seller_id)})"
          >
            ⭐ Оставить отзыв
          </button>

        </div>
      `;

    }

    return `
      <div class="info">
        ✅ Сделка завершена
      </div>
    `;
  }

  return "";
}

        "active",

    "reviewText"

      API+"/api/reviews",

        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          seller_id:Number(sellerId),
          buyer_id:Number(u.id),

    completed:"✅ Завершено",

async function loadPublicChat(force){

  if(chatLoading) return;

  chatLoading=true;

  try{

    const u=getChatUser();

    const res=await fetch(
      API+"/api/chat?user_id="+
      encodeURIComponent(u.id),
      {cache:"no-store"}
    );

    const data=await res.json();

    const box=document.getElementById(
      "publicChatMessages"
    );

    if(!data.ok || !data.messages.length){

      box.innerHTML=
        '<div class="empty">Пока сообщений нет.<br>Напиши первым 👋</div>';

      return;
    }

    box.innerHTML=data.messages.map(m=>{

      const mine=
        Number(m.user_id)===Number(u.id);

      const name=
        esc(m.first_name || "Пользователь");

      const avatar=m.photo_url
        ? `<img src="${esc(m.photo_url)}">`
        : esc(
            (m.first_name || "П")
              .charAt(0)
              .toUpperCase()
          );

      return `

        <div class="chat-row ${mine?"mine":""}">

          ${mine?"":`
            <div class="chat-avatar">
              ${avatar}
            </div>
          `}

          <div class="chat-content">

            ${mine?"":`
              <div class="chat-user">
                ${name}
                ${
                  m.username
                  ? `<span style="opacity:.6">@${esc(m.username)}</span>`
                  : ""
                }
              </div>
            `}

            <div class="chat-msg">

              ${esc(m.text)}

              <span class="chat-time">
                ${chatTime(m.created_at)}
              </span>

            </div>

          </div>

          ${mine?`
            <div class="chat-avatar">
              ${avatar}
            </div>
          `:""}

        </div>
      `;

    }).join("");

    requestAnimationFrame(()=>{
      const near=
        box.scrollHeight-
        box.scrollTop-
        box.clientHeight<150;

      if(force || near)
        box.scrollTop=box.scrollHeight;
    });

  }catch(e){

    console.error(e);

  }finally{

    chatLoading=false;

  }
}


async function sendPublicMessage(){

  const input=
    document.getElementById(
      "publicChatInput"
    );

  const text=input.value.trim();

  if(!text) return;

  const u=getChatUser();

  input.disabled=true;

  try{

    const res=await fetch(
      API+"/api/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          user_id:u.id,
          username:u.username,
          first_name:u.first_name,
          photo_url:u.photo_url,
          text
        })
      }
    );

    const data=await res.json();

    if(!res.ok || !data.ok){

      toast(
        data.error ||
        "Не удалось отправить сообщение"
      );

      return;
    }

    input.value="";

    await loadPublicChat(true);

    input.focus();

  }catch(e){

    toast("Ошибка подключения к чату");

  }finally{

    input.disabled=false;

  }
}


function chatTime(value){

  if(!value) return "";

  const d=new Date(
    String(value).replace(" ","T")+"Z"
  );

  if(isNaN(d.getTime())) return "";

  return d.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

    await loadTradeChat(tradeId);

  }catch(e){
    toast("Ошибка соединения");
  }
}


async function openAdminPanel(){
  const content = document.getElementById("modalContent");

  content.innerHTML = `
    <h2>👑 Админ-панель</h2>

    <div class="info">
      Управление маркетом
    </div>

    <button class="primary"
      onclick="loadAdminReports()">

      📦 Объявления
    </button>

    <button class="primary"
      onclick="loadAdminTrades()">
      🤝 Сделки
    </button>

async function loadAdminReports(){
  const box = document.getElementById("modalContent");

  box.innerHTML = `
    <h2>🛡️ Жалобы</h2>
    <div class="info">Загрузка...</div>
  `;

  try{
    const res = await fetch(
      API + "/api/reports?user_id=" +
      encodeURIComponent(user().id)
    );

    const data = await res.json();

    if(!res.ok || !data.ok){
      box.innerHTML = `
        <h2>🛡️ Жалобы</h2>
        <div class="info">${esc(data.error || "Нет доступа")}</div>
      `;
      return;
    }

    box.innerHTML = `
      <h2>🛡️ Жалобы</h2>

      ${
        data.reports.length
        ? data.reports.map(r => `
          <div class="trade-card">

            <div class="trade-card-title">
              🛡️ Жалоба #${Number(r.id)}
            </div>

            <div class="trade-card-meta">
              Объявление #${Number(r.listing_id)}
            </div>

            <div class="review-text">
              ${esc(r.reason || "Причина не указана")}
            </div>

            <div class="trade-card-meta">
              Статус объявления: ${esc(r.status)}
            </div>

          </div>
        `).join("")
        : `<div class="empty">Жалоб нет</div>`
      }
    `;

  }catch(e){
    toast("Ошибка соединения");
  }
}


async function loadAdminListings(){
  const box = document.getElementById("modalContent");

  box.innerHTML = `
    <h2>📦 Объявления</h2>
    <div class="info">Загрузка...</div>
  `;

  try{
    const res = await fetch(
      API + "/api/admin/listings?user_id=" +
      encodeURIComponent(user().id)
    );

    const data = await res.json();

    if(!res.ok || !data.ok){
      box.innerHTML = `
        <h2>📦 Объявления</h2>
        <div class="info">${esc(data.error || "Нет доступа")}</div>
      `;
      return;
    }

    box.innerHTML = `
      <h2>📦 Объявления</h2>

      ${

        ? data.listings.map(x => `
          <div class="trade-card">

            <div class="trade-card-title">
              ${esc(x.name)}
            </div>

            <div class="trade-card-price">
              ${esc(x.price)} ${esc(x.currency)}
            </div>

            <div class="trade-card-meta">
              #${Number(x.id)} · ${esc(x.status)}
            </div>

            ${
              x.status === "active"
              ? `
                <button
                  class="primary"
                  onclick="adminCloseListing(${Number(x.id)})">
                  🚫 Закрыть объявление
                </button>
              `
              : ""
            }

          </div>
        `).join("")
        : `<div class="empty">Объявлений нет</div>`
      }
    `;

  }catch(e){
    toast("Ошибка соединения");
  }
}


async function adminCloseListing(listingId){
  if(!confirm("Закрыть это объявление?")) return;

  try{
    const res = await fetch(
      API + "/api/admin/listings/close",
      {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          listing_id:Number(listingId),
          user_id:Number(user().id)
        })
      }
    );

    const data = await res.json();

    if(!res.ok || !data.ok){
      toast(data.error || "Ошибка");
      return;
    }

    toast("Объявление закрыто");
    loadAdminListings();

  }catch(e){
    toast("Ошибка соединения");
  }
}

/* Добавляем кнопку жалобы после профиля продавца */
const _openProduct = window.openProduct;

if(typeof _openProduct === "function"){
  window.openProduct = async function(id){
    await _openProduct(id);

    const content = document.getElementById("modalContent");

    if(!content) return;

    if(!content.querySelector(".report-button")){
      const sellerButton =
        content.querySelector(".seller-link");

      if(sellerButton){
        sellerButton.insertAdjacentHTML(
          "afterend",
          `
            <button
              class="report-button"
              onclick="sendReport(${Number(id)})"
              style="
                width:100%;
                margin-top:8px;
                min-height:45px;
                border-radius:15px;
                border:1px solid rgba(255,90,110,.18);
                background:rgba(255,80,100,.06);
                color:#ff9aa8;
                font-weight:800;
                cursor:pointer;
              "
            >
              🛡️ Пожаловаться
            </button>
          `
        );
      }
    }
  };
}


/* Добавляем кнопку чата в сделку */
const _openTrade = window.openTrade;

if(typeof _openTrade === "function"){
  window.openTrade = async function(tradeId,type){
    await _openTrade(tradeId,type);

    const content = document.getElementById("modalContent");

    if(!content) return;

    if(!content.querySelector(".trade-chat-button")){
      const button = document.createElement("button");

      button.className = "primary trade-chat-button";
      button.style.marginTop = "10px";
      button.textContent = "💬 Открыть чат сделки";

      button.onclick = () =>
        openTradeChat(Number(tradeId));

      content.appendChild(button);
    }
  };
}
