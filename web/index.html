<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atlantida Market</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif;padding-bottom:90px}
header{padding:18px 16px 10px;position:sticky;top:0;background:#090b10ee;backdrop-filter:blur(12px);z-index:5}
.logo{font-size:24px;font-weight:800}
.sub{color:#858b98;font-size:13px;margin-top:4px}
.search{margin-top:14px;background:#151922;border:1px solid #242936;border-radius:14px;padding:13px;color:#fff;width:100%;outline:0}
.wrap{padding:10px 16px}
.categories{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}
.categories button{border:0;background:#151922;color:#bbb;padding:10px 14px;border-radius:12px;white-space:nowrap}
.categories button.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#12151d;border:1px solid #232936;border-radius:17px;padding:13px}
.pic{height:115px;border-radius:13px;background:linear-gradient(135deg,#202635,#0d1017);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:10px}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:17px;font-weight:800;margin:7px 0;color:#fff}
.seller{font-size:12px;color:#858b98;margin-bottom:9px}
.buy{width:100%;border:0;border-radius:11px;padding:10px;background:#fff;color:#000;font-weight:700}
.empty{text-align:center;color:#777;padding:60px 20px}
.page{display:none}.page.active{display:block}
.profile{background:#12151d;border:1px solid #252b38;border-radius:18px;padding:18px}
.avatar{width:76px;height:76px;border-radius:50%;background:#222938;display:flex;align-items:center;justify-content:center;font-size:35px;margin:auto}
.name{text-align:center;font-size:21px;font-weight:800;margin-top:10px}
.username{text-align:center;color:#858b98;margin-top:4px}
.section{margin-top:18px;background:#151922;border-radius:14px;padding:15px}
label{display:block;color:#9aa1ae;font-size:13px;margin-bottom:7px}
input{width:100%;padding:12px;border-radius:11px;border:1px solid #2b3240;background:#0d1016;color:#fff;outline:0;margin-bottom:10px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;font-weight:700;margin-top:5px}
.primary{background:#fff;color:#000}.danger{background:#2a1518;color:#ff7777}
.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#10131aeF;border-top:1px solid #242936;display:flex;z-index:10;backdrop-filter:blur(15px)}
.bottom button{flex:1;border:0;background:none;color:#777;font-size:12px}
.bottom button.active{color:#fff}
.icon{font-size:21px;display:block;margin-bottom:4px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end}
.modal.show{display:flex}
.modalbox{background:#11151d;border-radius:22px 22px 0 0;width:100%;max-height:88vh;overflow:auto;padding:20px}
.modal h2{margin-top:0}
.close{float:right;border:0;background:#242a36;color:#fff;border-radius:50%;width:34px;height:34px}
.info{background:#171c25;border-radius:12px;padding:12px;margin:8px 0;color:#aaa;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">🌊 Atlantida Market</div>
  <div class="sub">Безпечний маркет цифрових товарів</div>
  <input id="search" class="search" placeholder="🔎 Пошук товарів..." oninput="render()">
</header>

<main>
<section id="home" class="page active">
<div class="wrap">
  <div class="categories">
    <button class="active" onclick="setCat('all',this)">Все</button>
    <button onclick="setCat('gifts',this)">🎁 Gifts</button>
    <button onclick="setCat('stars',this)">⭐ Stars</button>
    <button onclick="setCat('nft',this)">💎 NFT</button>
    <button onclick="setCat('crypto',this)">💰 Crypto</button>
    <button onclick="setCat('other',this)">🔥 Інше</button>
  </div>
  <div id="list" class="grid"></div>
</div>
</section>

<section id="sell" class="page">
<div class="wrap">
  <div class="profile">
    <h2>➕ Продати товар</h2>
    <div class="info">Створення оголошення підключимо до твоєї бази. Цей розділ уже готовий для подальшого підключення.</div>
    <input id="sellTitle" placeholder="Назва товару">
    <input id="sellPrice" placeholder="Ціна">
    <button class="btn primary" onclick="createListing()">Опублікувати</button>
  </div>
</div>
</section>

<section id="profile" class="page">
<div class="wrap">
  <div class="profile">
    <div class="avatar">👤</div>
    <div id="profileName" class="name">Користувач</div>
    <div id="profileUsername" class="username">@user</div>

    <div class="section">
      <h3>💳 Способи оплати</h3>
      <label>TON гаманець</label>
      <input id="tonWallet" placeholder="EQ... / UQ...">
      <label>USDT ERC-20 гаманець</label>
      <input id="usdtWallet" placeholder="0x...">
      <button class="btn primary" onclick="saveCryptoSend()">💾 Зберегти</button>
      <button class="btn danger" onclick="deleteCryptoSend()">🗑 Видалити гаманці</button>
      <div id="walletStatus" class="info">Завантаження...</div>
    </div>
  </div>
</div>
</section>
</main>

<nav class="bottom">
  <button class="active" onclick="page('home',this)">
    <span class="icon">🏠</span>Головна
  </button>
  <button onclick="page('home',this)">
    <span class="icon">🛒</span>Каталог
  </button>
  <button onclick="page('sell',this)">
    <span class="icon">➕</span>Продати
  </button>
  <button onclick="page('profile',this);showProfile()">
    <span class="icon">👤</span>Профіль
  </button>
</nav>

<div id="buyModal" class="modal" onclick="if(event.target===this)closeBuy()">
 <div class="modalbox">
  <button class="close" onclick="closeBuy()">×</button>
  <h2>🛒 Купівля</h2>
  <div id="buyContent"></div>
 </div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const API="https://atlantidamarket.onrender.com";
let category="all";
let listings=[];

function user(){
  return tg?.initDataUnsafe?.user || {
    id:0,
    first_name:"Гравець",
    username:"demo"
  };
}

function page(id,btn){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

function setCat(cat,btn){
  category=cat;
  document.querySelectorAll(".categories button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]));
}

async function loadListings(){
  try{
    const r=await fetch(API+"/api/listings");
    const d=await r.json();
    listings=Array.isArray(d)?d:(d.listings||[]);
  }catch(e){
    listings=[];
  }
  render();
}

function render(){
  const box=document.getElementById("list");
  const q=(document.getElementById("search").value||"").toLowerCase();

  let arr=listings.filter(x=>{
    const text=JSON.stringify(x).toLowerCase();
    const okSearch=!q||text.includes(q);
    const cat=x.category||"other";
    const okCat=category==="all"||cat===category;
    return okSearch&&okCat;
  });

  if(!arr.length){
    box.innerHTML='<div class="empty" style="grid-column:1/-1">Поки що товарів немає.<br>Спробуй змінити пошук або категорію.</div>';
    return;
  }

  box.innerHTML=arr.map(x=>`
    <div class="card">
      <div class="pic">${x.emoji||"📦"}</div>
      <div class="title">${escapeHtml(x.title||"Товар")}</div>
      <div class="price">${escapeHtml(x.price||"0")} ⭐</div>
      <div class="seller">Продавець #${escapeHtml(x.seller_id||"")}</div>
      <button class="buy" onclick="buy(${Number(x.id)||0})">Купити</button>
    </div>
  `).join("");
}

async function showProfile(){
  const u=user();
  document.getElementById("profileName").textContent=u.first_name||"Користувач";
  document.getElementById("profileUsername").textContent=u.username?"@"+u.username:"Telegram ID: "+(u.id||0);
  await getCryptoSend();
}

async function getCryptoSend(){
  const id=Number(user()?.id||0);
  if(!id){
    document.getElementById("walletStatus").textContent="⚠️ Відкрий маркет через Telegram.";
    return;
  }

  try{
    const r=await fetch(API+"/api/payment-methods/"+id);
    const d=await r.json();

    if(!d.ok) throw new Error(d.message||d.error);

    document.getElementById("tonWallet").value=d.ton_wallet||"";
    document.getElementById("usdtWallet").value=d.usdt_wallet||"";
    document.getElementById("walletStatus").textContent=
      d.connected ? "✅ Гаманці підключені" : "ℹ️ Гаманці ще не підключені";
  }catch(e){
    document.getElementById("walletStatus").textContent="❌ Не вдалося завантажити гаманці";
  }
}

async function saveCryptoSend(){
  const id=Number(user()?.id||0);
  const ton=document.getElementById("tonWallet").value.trim();
  const usdt=document.getElementById("usdtWallet").value.trim();

  if(!id){
    alert("Telegram ID не отримано. Відкрий сайт саме через Telegram.");
    return;
  }

  if(!ton&&!usdt){
    alert("Вкажи хоча б один гаманець.");
    return;
  }

  if(ton&&!/^(EQ|UQ|kQ)[A-Za-z0-9_-]+$/.test(ton)){
    alert("Невірний TON-адрес.");
    return;
  }

  if(usdt&&!/^0x[a-fA-F0-9]{40}$/.test(usdt)){
    alert("Невірний USDT ERC-20 адрес.");
    return;
  }

  try{
    const r=await fetch(API+"/api/payment-methods",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        seller_id:id,
        ton_wallet:ton,
        usdt_wallet:usdt
      })
    });

    const d=await r.json();

    if(!r.ok||!d.ok){
      throw new Error(d.message||d.error||"Помилка сервера");
    }

    document.getElementById("walletStatus").textContent="✅ Гаманці збережено";
    alert("✅ Гаманці збережено");
  }catch(e){
    alert("❌ "+e.message);
  }
}

async function deleteCryptoSend(){
  const id=Number(user()?.id||0);
  if(!id){
    alert("Telegram ID не отримано.");
    return;
  }

  try{
    const r=await fetch(API+"/api/payment-methods",{
      method:"DELETE",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({seller_id:id})
    });

    const d=await r.json();
    if(!d.ok)throw new Error(d.error||"Помилка");

    document.getElementById("tonWallet").value="";
    document.getElementById("usdtWallet").value="";
    document.getElementById("walletStatus").textContent="🗑 Гаманці видалено";
  }catch(e){
    alert("❌ "+e.message);
  }
}

async function buy(id){
  document.getElementById("buyModal").classList.add("show");
  const box=document.getElementById("buyContent");
  box.innerHTML="⏳ Завантаження...";

  const item=listings.find(x=>Number(x.id)===Number(id));

  if(!item){
    box.innerHTML="❌ Товар не знайдено.";
    return;
  }

  const seller=Number(item.seller_id||0);

  try{
    const r=await fetch(API+"/api/payment-methods/"+seller);
    const d=await r.json();

    let html=`
      <div class="info">
        <b>${escapeHtml(item.title||"Товар")}</b><br>
        Ціна: ${escapeHtml(item.price||"0")} ⭐
      </div>
    `;

    if(d.ton_wallet){
      html+=`<div class="info">💎 TON<br><b>${escapeHtml(d.ton_wallet)}</b></div>`;
    }

    if(d.usdt_wallet){
      html+=`<div class="info">💵 USDT ERC-20<br><b>${escapeHtml(d.usdt_wallet)}</b></div>`;
    }

    if(!d.ton_wallet&&!d.usdt_wallet){
      html+=`<div class="empty">Продавець ще не підключив способи оплати.</div>`;
    }

    box.innerHTML=html;
  }catch(e){
    box.innerHTML="❌ Не вдалося завантажити способи оплати.";
  }
}

function closeBuy(){
  document.getElementById("buyModal").classList.remove("show");
}

async function createListing(){
  const title=document.getElementById("sellTitle").value.trim();
  const price=document.getElementById("sellPrice").value.trim();
  const id=Number(user()?.id||0);

  if(!id){
    alert("Відкрий маркет через Telegram.");
    return;
  }

  if(!title||!price){
    alert("Заповни назву та ціну.");
    return;
  }

  try{
    const r=await fetch(API+"/api/listings",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        seller_id:id,
        title:title,
        price:price,
        category:"other",
        description:"",
        emoji:"📦"
      })
    });

    const d=await r.json();

    if(!r.ok||d.ok===false){
      throw new Error(d.error||d.message||"Помилка");
    }

    alert("✅ Оголошення створено");
    document.getElementById("sellTitle").value="";
    document.getElementById("sellPrice").value="";
    loadListings();
  }catch(e){
    alert("❌ "+e.message);
  }
}

loadListings();
</script>
</body>
</html>
