cd ~/AtlantidaMarket

cat > index.html <<'EOF'
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Atlantida Market</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#071018;
    color:#fff;
    font-family:Arial,sans-serif;
}
header{
    padding:20px 16px 10px;
    font-size:26px;
    font-weight:800;
}
.sub{
    color:#8fa3b8;
    font-size:14px;
    padding:0 16px 16px;
}
.search{
    margin:0 16px 14px;
}
.search input{
    width:100%;
    padding:14px 16px;
    border:1px solid #203142;
    border-radius:14px;
    background:#0d1924;
    color:white;
    outline:none;
    font-size:15px;
}
.categories{
    display:flex;
    gap:8px;
    padding:0 16px 16px;
    overflow-x:auto;
}
.categories button{
    white-space:nowrap;
    border:1px solid #243849;
    background:#0d1924;
    color:#b9c8d5;
    border-radius:12px;
    padding:10px 14px;
}
.categories button.active{
    background:#168cff;
    border-color:#168cff;
    color:white;
}
#listings{
    padding:0 16px 100px;
}
.card{
    background:#0d1924;
    border:1px solid #1d3040;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}
.card h3{
    margin:0 0 8px;
    font-size:18px;
}
.info{
    color:#93a8ba;
    font-size:13px;
    margin-bottom:10px;
}
.price{
    font-size:19px;
    font-weight:800;
    color:#55b5ff;
}
.desc{
    color:#b7c5d0;
    margin-top:9px;
    font-size:14px;
}
.empty{
    text-align:center;
    color:#8193a4;
    padding:50px 10px;
}
.sell{
    position:fixed;
    left:16px;
    right:16px;
    bottom:16px;
    border:0;
    border-radius:15px;
    padding:15px;
    background:#168cff;
    color:white;
    font-size:16px;
    font-weight:700;
}
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    padding:20px;
    align-items:center;
    justify-content:center;
}
.modal-box{
    width:100%;
    max-width:430px;
    background:#0d1924;
    border:1px solid #243849;
    border-radius:18px;
    padding:20px;
}
.modal-box h2{
    margin-top:0;
}
.modal-box input,
.modal-box textarea,
.modal-box select{
    width:100%;
    margin:6px 0;
    padding:13px;
    background:#071018;
    border:1px solid #263b4d;
    border-radius:12px;
    color:white;
}
.modal-box textarea{
    min-height:90px;
    resize:vertical;
}
.actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}
.actions button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:12px;
    font-weight:700;
}
.cancel{
    background:#253542;
    color:white;
}
.submit{
    background:#168cff;
    color:white;
}
.status{
    margin-top:10px;
    font-size:13px;
    color:#91a7b8;
}
</style>
</head>

<body>

<header>🌊 Atlantida Market</header>
<div class="sub">Безпечний маркет Telegram-подарунків, Stars, NFT та TON</div>

<div class="search">
    <input id="search" placeholder="🔎 Пошук товару...">
</div>

<div class="categories">
    <button class="active" onclick="setCategory('',this)">Усі</button>
    <button onclick="setCategory('Telegram Stars',this)">⭐ Stars</button>
    <button onclick="setCategory('Telegram Gifts',this)">🎁 Gifts</button>
    <button onclick="setCategory('NFT',this)">💎 NFT</button>
    <button onclick="setCategory('TON',this)">💠 TON</button>
</div>

<div id="listings">
    <div class="empty">Завантаження...</div>
</div>

<button class="sell" onclick="openSell()">＋ Продати товар</button>

<div class="modal" id="modal">
    <div class="modal-box">
        <h2>Продати товар</h2>

        <select id="category">
            <option value="Telegram Stars">Telegram Stars</option>
            <option value="Telegram Gifts">Telegram Gifts</option>
            <option value="NFT">NFT</option>
            <option value="TON">TON</option>
        </select>

        <input id="name" placeholder="Назва товару">
        <input id="amount" placeholder="Кількість">
        <input id="price" placeholder="Ціна">
        <textarea id="description" placeholder="Опис"></textarea>

        <div class="actions">
            <button class="cancel" onclick="closeSell()">Скасувати</button>
            <button class="submit" onclick="createListing()">Опублікувати</button>
        </div>

        <div class="status" id="status"></div>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){
    tg.ready();
    tg.expand();
}

const API = "https://atlantidamarket.onrender.com";

let currentCategory = "";

function getUser(){
    if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
        return tg.initDataUnsafe.user;
    }

    return {
        id: 0,
        first_name: "Demo",
        username: "demo"
    };
}

async function loadListings(){
    const box = document.getElementById("listings");

    try{
        let url = API + "/api/listings";

        if(currentCategory){
            url += "?category=" + encodeURIComponent(currentCategory);
        }

        const search = document.getElementById("search").value.trim();

        if(search){
            url = API + "/api/listings?search=" + encodeURIComponent(search);
        }

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if(!data.length){
            box.innerHTML = '<div class="empty">Поки що оголошень немає</div>';
            return;
        }

        box.innerHTML = data.map(item => `
            <div class="card">
                <h3>${escapeHtml(item.name)}</h3>

                <div class="info">
                    ${escapeHtml(item.category)}
                    • Кількість: ${escapeHtml(item.amount)}
                </div>

                <div class="price">
                    ${escapeHtml(item.price)}
                </div>

                ${
                    item.description
                    ? `<div class="desc">${escapeHtml(item.description)}</div>`
                    : ""
                }
            </div>
        `).join("");

    }catch(error){
        console.error(error);

        box.innerHTML = `
            <div class="empty">
                Не вдалося завантажити оголошення
                <br><br>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;
    }
}

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function setCategory(category, button){
    currentCategory = category;

    document.querySelectorAll(".categories button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    loadListings();
}

let searchTimer;

document.getElementById("search").addEventListener("input",()=>{
    clearTimeout(searchTimer);

    searchTimer = setTimeout(()=>{
        loadListings();
    },300);
});

function openSell(){
    document.getElementById("modal").style.display = "flex";
}

function closeSell(){
    document.getElementById("modal").style.display = "none";
    document.getElementById("status").textContent = "";
}

async function createListing(){

    const user = getUser();

    const category = document.getElementById("category").value;
    const name = document.getElementById("name").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const price = document.getElementById("price").value.trim();
    const description = document.getElementById("description").value.trim();

    const status = document.getElementById("status");

    if(!name || !amount || !price){
        status.textContent = "Заповни назву, кількість та ціну.";
        return;
    }

    status.textContent = "Публікуємо...";

    try{

        const response = await fetch(API + "/api/listings",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                seller_id:user.id,
                category,
                name,
                amount,
                price,
                description
            })
        });

        const result = await response.json();

        if(!response.ok || !result.ok){
            throw new Error(result.error || "Помилка публікації");
        }

        status.textContent = "Оголошення опубліковано!";

        document.getElementById("name").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("price").value = "";
        document.getElementById("description").value = "";

        setTimeout(()=>{
            closeSell();
            loadListings();
        },700);

    }catch(error){
        console.error(error);
        status.textContent = "Помилка: " + error.message;
    }
}

loadListings();
</script>

</body>
</html>
EOF
